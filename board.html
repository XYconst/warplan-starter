<title>Warplan Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>

  :root{
    /* Anchor Media brand system. Exact tokens, do not substitute. */
    --paper:#fcfcfa;            /* cream bg   */
    --sheet:#ffffff;            /* card       */
    --ink:#000321;              /* navy ink   */
    --ink-2:#4a5268;            /* muted-fg   */
    --muted:rgba(0,3,33,.5);    /* eyebrow    */
    --faint:rgba(0,3,33,.32);
    --line:rgba(0,3,33,.10);
    --line-strong:rgba(0,3,33,.16);
    --band:#000321;             /* navy band  */
    --band-fg:#fcfcfa;
    --highlight:#F2A516;        /* amber, accent only, navy text on top */
    --accent:#0038ff;           /* cobalt     */
    --accent-soft:rgba(0,56,255,.08);
    --surface:#f5f5f3;          /* muted      */
    --shadow:0 1px 2px rgba(0,3,33,.05), 0 8px 24px rgba(0,3,33,.06);
    --font:'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --serif:'Instrument Serif', Georgia, 'Times New Roman', serif;
  }
  /* Deliberate single-look design: this is a paper planning board, light only. */
  *{box-sizing:border-box}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font);
    font-size:14px;
    line-height:1.5;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
  [hidden]{display:none !important}

  /* ---------- toolbar ---------- */
  .toolbar{
    position:sticky; top:0; z-index:30;
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    padding:10px 16px;
    background:rgba(252,252,250,.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .toolbar .spacer{flex:1}
  .btn{
    font:inherit; font-weight:600; font-size:12.5px; letter-spacing:.02em;
    min-height:36px; padding:8px 14px;
    background:var(--sheet); color:var(--ink);
    border:1px solid var(--line-strong); border-radius:2px;
    cursor:pointer;
    transition:background .18s ease, color .18s ease, border-color .18s ease;
  }
  .btn:hover{background:var(--ink); color:#fff}
  .btn:disabled{opacity:.35; cursor:not-allowed}
  .btn:disabled:hover{background:var(--sheet); color:var(--ink)}
  .btn:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  .btn.ghost{border-color:var(--line); color:var(--ink-2)}
  .btn.ghost:hover{background:var(--ink-2); color:#fff; border-color:var(--ink-2)}
  .btn.solid{background:var(--ink); color:#fff}
  .btn.solid:hover{background:var(--accent); border-color:var(--accent)}
  .saved{font-family:var(--mono); font-size:11px; color:var(--muted); min-width:88px}

  /* ---------- interview ---------- */
  .wiz{padding:26px 16px 90px; max-width:1240px; margin:0 auto}
  .wiz-head{margin-bottom:16px}
  .track{display:flex; gap:3px; margin-bottom:10px}
  .track span{
    height:4px; flex:1; background:var(--line); border-radius:2px;
    transition:background .2s ease;
  }
  .track span.on{background:var(--ink)}
  .track span.now{background:var(--accent)}
  .counter{
    font-family:var(--mono); font-size:10.5px; font-weight:500; letter-spacing:.12em;
    text-transform:uppercase; color:var(--muted);
    display:flex; justify-content:space-between; gap:12px;
  }
  .wiz-grid{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr); gap:28px; align-items:start}

  .qcard{
    background:var(--sheet); border:1px solid var(--line);
    box-shadow:var(--shadow); padding:26px 26px 22px;
  }
  .eyebrow{
    font-family:var(--mono); font-size:10.5px; font-weight:700; letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink);
    background:var(--highlight); display:inline-block; padding:3px 8px; margin-bottom:14px;
  }
  .eyebrow.plain{background:none; color:var(--muted); padding:0}
  .qcard h2{
    margin:0 0 10px; font-size:clamp(20px,2.4vw,28px); font-weight:800;
    line-height:1.2; letter-spacing:-.015em; text-wrap:balance;
  }
  .why{margin:0 0 18px; font-size:13.5px; color:var(--ink-2); max-width:62ch}
  .why b{color:var(--ink)}

  .field label{
    display:block; font-family:var(--mono); font-size:10.5px; font-weight:500; letter-spacing:.12em;
    text-transform:uppercase; color:var(--muted); margin-bottom:6px;
  }
  .field input, .field textarea{
    width:100%; font:inherit; font-size:15px; line-height:1.55; color:var(--ink);
    padding:12px 13px; background:#fff;
    border:1px solid var(--line); border-radius:2px; resize:vertical;
  }
  .field input:focus, .field textarea:focus{
    outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,56,255,.16);
  }
  .field textarea{min-height:130px}
  .nudge{
    margin:8px 0 0; font-size:12.5px; color:var(--ink-2);
    border-left:3px solid var(--highlight); padding:2px 0 2px 10px;
  }

  .ex{margin-top:20px}
  .ex-label{
    font-family:var(--mono); font-size:10.5px; font-weight:500; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted); margin-bottom:8px;
  }
  .ex-list{display:flex; flex-direction:column; gap:7px}
  .ex-item{
    text-align:left; font:inherit; font-size:13px; line-height:1.5; color:var(--ink-2);
    background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--highlight);
    border-radius:2px; padding:10px 12px; cursor:pointer;
    transition:border-color .18s ease, color .18s ease, background .18s ease;
    white-space:pre-line;
  }
  .ex-item:hover{background:#fff; border-color:var(--ink); color:var(--ink)}
  .ex-item:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  .ex-hint{font-size:11.5px; color:var(--faint); margin-top:8px}

  .wiz-nav{display:flex; gap:10px; align-items:center; margin-top:24px; padding-top:18px; border-top:1px solid var(--line)}
  .wiz-nav .spacer{flex:1}
  .kbd{font-family:var(--mono); font-size:10.5px; color:var(--faint)}

  /* pillar picker */
  .picker{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px}
  .pick{
    display:flex; gap:10px; align-items:flex-start; cursor:pointer;
    border:1px solid var(--line); border-radius:2px; padding:12px 13px; background:#fff;
    transition:border-color .18s ease, background .18s ease;
  }
  .pick:hover{border-color:var(--ink)}
  .pick.on{border-color:var(--ink); background:#fff; box-shadow:inset 3px 0 0 var(--highlight)}
  .pick input{margin:2px 0 0; width:16px; height:16px; accent-color:var(--ink); cursor:pointer}
  .pick b{display:block; font-size:13px; font-weight:800; letter-spacing:.04em; text-transform:uppercase}
  .pick span{display:block; font-size:11.5px; color:var(--muted); line-height:1.4; margin-top:2px}
  .addown{display:flex; gap:8px; margin-top:14px}
  .addown input{flex:1}

  /* shot list */
  .shots{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px}
  .shot-slot{
    position:relative; border:1px dashed var(--line); border-radius:2px;
    background:#fff; padding:0; cursor:pointer; text-align:left; font:inherit;
    display:flex; flex-direction:column; overflow:hidden; min-height:132px;
    transition:border-color .18s ease, background .18s ease;
  }
  .shot-slot:hover{border-color:var(--ink); background:#fff}
  .shot-slot:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  .shot-slot.filled{border-style:solid}
  .shot-slot .cap{padding:10px 11px; font-size:12px; line-height:1.4; color:var(--ink-2)}
  .shot-slot.filled .cap{color:var(--ink); font-weight:600}
  .shot-slot .thumb{width:100%; height:96px; object-fit:cover; display:block; background:var(--surface)}
  .shot-slot .plus{
    margin-top:auto; padding:8px 11px; font-family:var(--mono); font-size:10px; font-weight:500;
    letter-spacing:.1em; text-transform:uppercase; color:var(--faint);
  }
  .shot-slot.filled .plus{color:var(--accent)}
  .dropzone{
    margin-top:12px; border:1px dashed var(--line); border-radius:2px;
    padding:16px; text-align:center; color:var(--muted); font-size:12.5px; cursor:pointer;
    transition:border-color .18s ease, background .18s ease;
  }
  .dropzone:hover, .dropzone.dragover{border-color:var(--accent); background:var(--accent-soft); color:var(--ink-2)}

  /* live preview */
  .preview{position:sticky; top:74px}
  .preview-label{
    font-family:var(--mono); font-size:10.5px; font-weight:500; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted); margin-bottom:8px; display:flex; justify-content:space-between;
  }
  .preview-frame{
    background:var(--sheet); border:1px solid var(--line); box-shadow:var(--shadow);
    max-height:calc(100vh - 140px); overflow:auto;
  }

  /* ---------- board ---------- */
  .board{padding:16px 16px 80px; overflow-x:auto}
  .sheet{
    background:var(--sheet); border:1px solid var(--line); box-shadow:var(--shadow);
    width:fit-content; min-width:100%; margin:0 auto;
  }
  .band{
    background:var(--band); color:var(--band-fg);
    padding:16px 22px; border-bottom:1px solid var(--line);
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px;
  }
  .band h1{
    grid-column:2; margin:0; text-align:center;
    font-size:clamp(15px,1.6vw,22px); font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  }
  .band h1 [contenteditable]{display:inline-block; min-width:40px}
  .band h1 [contenteditable]:focus{background:rgba(252,252,250,.14); box-shadow:0 0 0 2px rgba(252,252,250,.4)}
  .lockup{grid-column:1; display:flex; align-items:center; gap:9px; justify-self:start}
  .lockup .mark{
    width:30px; height:30px; border-radius:8px; background:var(--band-fg); color:var(--band);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .lockup .mark svg{width:18px; height:18px}
  .lockup .wordmark{font-size:14px; font-weight:700; letter-spacing:-.02em; line-height:1.1}
  .lockup .sub{font-family:var(--mono); font-size:8.5px; font-weight:500; letter-spacing:.16em; text-transform:uppercase; opacity:.62}
  @media (max-width:760px){
    .band{grid-template-columns:1fr; justify-items:center; text-align:center}
    .band h1, .lockup{grid-column:1}
  }

  .strip{
    display:grid; grid-template-columns:minmax(180px,240px) repeat(auto-fit,minmax(260px,1fr));
    gap:22px; padding:26px 24px 30px; align-items:start;
  }
  .sticky{background:var(--highlight); padding:14px 16px; box-shadow:2px 3px 0 rgba(0,3,33,.14)}
  .sticky .rich{font-weight:700; font-size:13.5px; color:var(--ink)}
  .sticky .rich.is-empty::before{color:rgba(0,3,33,.55)}
  .sticky .rich ul{list-style:none; margin:0; padding:0}
  .sticky .rich li{text-decoration:underline; text-underline-offset:3px; margin:.25em 0}
  .brief{border:1px solid var(--line); padding:14px 16px; background:#fff; box-shadow:var(--shadow)}
  .brief h3{margin:0 0 8px; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.08em}
  .brief h3 mark{background:var(--highlight); padding:1px 4px}
  .brief .rich{font-size:12px; color:var(--ink-2); line-height:1.6}
  .brief .rich[data-key="brief1"]{font-family:var(--serif); font-style:italic; font-size:15px; line-height:1.45; color:var(--ink)}
  .brief .rich[data-key="brief1"].is-empty::before{font-family:var(--font); font-size:12px}

  .pillars{display:grid; grid-template-columns:repeat(var(--cols,5), minmax(300px,1fr)); border-top:1px solid var(--line)}
  .pillar{
    border-right:1px solid var(--line); border-bottom:1px solid var(--line);
    padding:22px 18px 28px; min-width:0; position:relative;
    display:flex; flex-direction:column; gap:16px;
  }
  .pillar:last-child{border-right:none}
  .pillar h2{
    margin:0; text-align:center; font-size:clamp(20px,2vw,30px); font-weight:900;
    letter-spacing:-.01em; text-transform:uppercase;
    border-bottom:2px solid var(--ink); padding-bottom:4px; align-self:center;
  }
  .outcome{
    background:var(--highlight); padding:10px 12px;
    font-weight:800; font-size:12px; line-height:1.45;
    text-transform:uppercase; letter-spacing:.02em; text-align:center;
  }
  .block{border:1px solid var(--line); padding:12px 13px}
  .block-label{font-family:var(--mono); font-size:9.5px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:7px}
  .rich{font-size:12.5px; line-height:1.6; color:var(--ink-2); outline:none; word-break:break-word}
  .rich ul{margin:.2em 0 .2em 1.05em; padding:0}
  .rich li{margin:.15em 0}
  .rich b, .rich strong{color:var(--ink)}
  [contenteditable]{outline:none}
  [contenteditable]:focus{background:var(--accent-soft); box-shadow:0 0 0 2px rgba(0,56,255,.35); border-radius:2px}
  .is-empty::before{
    content:attr(data-ph); color:var(--faint); font-weight:400; font-style:italic;
    text-transform:none; letter-spacing:0; white-space:pre-line;
  }

  .collage{
    display:grid; grid-template-columns:1fr 1fr; gap:6px; min-height:120px; padding:6px;
    border:1px dashed var(--line); align-content:start;
    transition:border-color .18s ease, background .18s ease;
  }
  .collage.dragover{border-color:var(--accent); background:var(--accent-soft)}
  .collage .hint{
    grid-column:1 / -1; display:flex; align-items:center; justify-content:center;
    min-height:104px; padding:10px; color:var(--muted); font-size:11.5px; text-align:center;
  }
  .shot{position:relative; margin:0; line-height:0; background:var(--surface)}
  .shot img{width:100%; height:100%; object-fit:cover; display:block; max-width:100%}
  .shot.wide{grid-column:1 / -1}
  .shot .kill{
    position:absolute; top:4px; right:4px; width:24px; height:24px; min-height:24px;
    display:none; align-items:center; justify-content:center; padding:0; border-radius:50%;
    background:rgba(0,3,33,.82); color:#fff; border:none; cursor:pointer;
  }
  .shot:hover .kill, .shot:focus-within .kill{display:flex}
  .shot .kill:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  .shot .kill svg{width:13px; height:13px}

  .pillar-tools{display:flex; gap:8px; justify-content:center; margin-top:auto; padding-top:8px; flex-wrap:wrap}
  .mini{
    font:inherit; font-size:11px; font-weight:600; background:none;
    border:1px solid var(--line); border-radius:2px; color:var(--muted);
    padding:6px 10px; min-height:32px; cursor:pointer;
    transition:color .18s ease, border-color .18s ease;
  }
  .mini:hover{color:var(--ink); border-color:var(--ink)}
  .mini:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  .addcol{display:flex; align-items:center; justify-content:center; padding:24px; border-bottom:1px solid var(--line)}

  /* ---------- done screen ---------- */
  .done{
    max-width:620px; margin:0 auto; text-align:center;
    background:var(--sheet); border:1px solid var(--line); box-shadow:var(--shadow); padding:40px 32px;
  }
  .done h2{margin:0 0 10px; font-size:clamp(24px,3vw,34px); font-weight:900; letter-spacing:-.02em}
  .done p{margin:0 auto 22px; font-size:14px; color:var(--ink-2); max-width:48ch}
  .done .row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
  .gaps{margin:22px auto 0; text-align:left; max-width:44ch; font-size:12.5px; color:var(--ink-2)}
  .gaps b{display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:6px}
  .gaps ul{margin:0; padding-left:18px}

  /* ---------- dialog ---------- */
  dialog{border:1px solid var(--ink); border-radius:2px; padding:0; max-width:min(720px,92vw); width:100%; box-shadow:0 20px 60px rgba(0,3,33,.28)}
  dialog::backdrop{background:rgba(0,3,33,.5)}
  .dlg-in{padding:20px}
  .dlg-in h3{margin:0 0 6px; font-size:16px; font-weight:800}
  .dlg-in p{margin:0 0 12px; font-size:12.5px; color:var(--ink-2)}
  .dlg-in textarea{width:100%; height:280px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; padding:10px; border:1px solid var(--line); border-radius:2px; resize:vertical}
  .dlg-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:12px; flex-wrap:wrap}

  @media (max-width:980px){
    .wiz-grid{grid-template-columns:1fr}
    .preview{position:static}
    .preview-frame{max-height:none}
  }
  @media (max-width:900px){
    .pillars{grid-template-columns:1fr}
    .pillar{border-right:none}
    .strip{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }


  /* ---------- numbered goals ---------- */
  .goals .rich ul{list-style:none; margin:0; padding:0; counter-reset:goal}
  .goals .rich li{
    counter-increment:goal; position:relative;
    padding-left:24px; margin:.4em 0;
  }
  .goals .rich li::before{
    content:counter(goal); position:absolute; left:0; top:.05em;
    font-family:var(--mono); font-size:9.5px; font-weight:700;
    width:16px; height:16px; border-radius:3px;
    background:var(--ink); color:var(--band-fg);
    display:flex; align-items:center; justify-content:center;
  }
  .toolbar .divider{width:1px; height:24px; background:var(--line); margin:0 4px}
  .btn[aria-current="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}



  /* ---------- phone: tabs become a bottom bar ---------- */
  .toolbar .tabs, .toolbar .tools{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .moreBtn{display:none}
  @media (max-width:760px){
    body{padding-bottom:calc(68px + env(safe-area-inset-bottom))}
    .toolbar{
      position:fixed; top:auto; bottom:0; left:0; right:0; z-index:40;
      border-top:1px solid var(--line); border-bottom:none;
      padding:6px 8px calc(6px + env(safe-area-inset-bottom));
      gap:6px;
    }
    .toolbar .divider, .toolbar .spacer, .toolbar .saved{display:none}
    .toolbar .tabs{flex:1; gap:4px; flex-wrap:nowrap}
    .toolbar .tabs .btn{
      flex:1; min-width:0; padding:10px 2px; min-height:48px;
      font-size:10.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:0; border-color:transparent; background:none;
    }
    .toolbar .tabs .btn[aria-current="true"]{background:var(--ink); color:#fff}
    .moreBtn{display:block; min-height:48px; padding:10px 12px; flex:none}
    .toolbar .tools{
      display:none; position:absolute; bottom:calc(100% + 6px); right:8px;
      flex-direction:column; align-items:stretch; gap:6px;
      background:var(--sheet); border:1px solid var(--line-strong);
      box-shadow:0 -8px 30px rgba(0,3,33,.18); padding:8px; min-width:200px;
    }
    .toolbar.more-open .tools{display:flex}
    .toolbar .tools .btn{min-height:46px; text-align:left}

    /* thumb-sized rows */
    .blk{grid-template-columns:26px 46px 1fr 10px; padding:14px 4px; min-height:52px}
    .blk input{width:22px; height:22px}
    .blk-l{font-size:15px}
    .win-in{min-height:46px}
    .daily{padding:14px 12px 24px}
    .daily-main{padding:16px 14px}
    .daily-head h2{font-size:24px}
    .mini{min-height:40px}
  }

  /* ---------- daily loop ---------- */
  .daily{padding:24px 16px 90px; max-width:1240px; margin:0 auto}
  .daily-grid{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr); gap:24px; align-items:start}
  .daily-main{background:var(--sheet); border:1px solid var(--line); box-shadow:var(--shadow); padding:22px}
  .daily-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px}
  .daily-head h2{margin:0; font-size:30px; font-weight:900; letter-spacing:-.02em}
  .daily-sub{margin:2px 0 0; font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
  .daynav{display:flex; gap:6px}

  .wins{background:var(--surface); padding:14px 15px; margin-bottom:18px}
  .win-row{display:flex; align-items:center; gap:10px; margin-top:8px}
  .win-n{
    flex:none; width:20px; height:20px; border-radius:3px; background:var(--ink); color:var(--band-fg);
    font-family:var(--mono); font-size:10px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .win-in{
    flex:1; font:inherit; font-size:14px; color:var(--ink);
    padding:8px 10px; background:#fff; border:1px solid var(--line); border-radius:2px;
  }
  .win-in:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,56,255,.16)}

  .blocks{display:flex; flex-direction:column}
  .blk{
    display:grid; grid-template-columns:22px 52px 1fr 10px; gap:12px; align-items:center;
    padding:11px 6px; border-top:1px solid var(--line); cursor:pointer;
    transition:background .15s ease;
  }
  .blk:last-child{border-bottom:1px solid var(--line)}
  .blk:hover{background:var(--surface)}
  .blk input{width:19px; height:19px; accent-color:var(--accent); cursor:pointer; margin:0}
  .blk-t{font-family:var(--mono); font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
  .blk-l{font-size:14.5px; line-height:1.35}
  .blk-dot{width:9px; height:9px; border-radius:50%; flex:none}
  .blk.is-done .blk-l{text-decoration:line-through; color:var(--faint)}
  .blk.is-done .blk-t{color:var(--faint)}

  .daily-side{display:flex; flex-direction:column; gap:14px; position:sticky; top:74px}
  .scorecard{background:var(--sheet); border:1px solid var(--line); box-shadow:var(--shadow); padding:16px}
  .score-big{font-size:40px; font-weight:900; letter-spacing:-.03em; line-height:1; margin:2px 0 10px; font-variant-numeric:tabular-nums}
  .bar{height:8px; background:var(--surface); border-radius:2px; overflow:hidden}
  .bar-fill{height:100%; transition:width .25s ease}
  .score-note{font-size:12px; color:var(--ink-2); margin-top:8px; line-height:1.4}

  .day-strip{display:grid; grid-template-columns:repeat(14,1fr); gap:3px; margin-top:4px}
  .cell{height:26px; border-radius:2px; cursor:pointer; border:1px solid transparent}
  .cell.now{border-color:var(--ink)}

  .prow{display:grid; grid-template-columns:9px 74px 1fr 34px; gap:8px; align-items:center; margin-top:9px}
  .pname{font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; color:var(--ink-2)}
  .pbar{height:6px; background:var(--surface); border-radius:2px; overflow:hidden; display:block}
  .pbar-fill{height:6px; display:block; border-radius:2px}
  .ppct{font-family:var(--mono); font-size:10px; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums}

  .mrow{display:grid; grid-template-columns:1fr auto; gap:6px 10px; margin-top:12px}
  .mlabel{font-size:13px; font-weight:700}
  .mval{font-family:var(--mono); font-size:11px; color:var(--ink-2); font-variant-numeric:tabular-nums; text-align:right}
  .mbar{grid-column:1 / -1; height:7px; background:var(--surface); border-radius:2px; overflow:hidden; display:block}
  .mbar-fill{height:7px; display:block; background:var(--accent); border-radius:2px}
  .mpct{grid-column:1 / -1; font-family:var(--mono); font-size:10px; color:var(--muted); text-align:right}
  .spark{display:flex; align-items:flex-end; gap:3px; height:48px; margin-top:16px}
  .spark .sp{flex:1; background:var(--accent); opacity:.75; border-radius:1px 1px 0 0}
  .spark .sp:last-child{opacity:1; background:var(--ink)}

  @media (max-width:980px){
    .daily-grid{grid-template-columns:1fr}
    .daily-side{position:static}
  }

  /* ---------- A4 pillar pages ---------- */
  .pages{padding:24px 16px 90px; display:flex; flex-direction:column; align-items:center; gap:24px}
  .page{
    width:210mm; min-height:297mm; background:var(--sheet);
    box-shadow:var(--shadow); display:flex; flex-direction:column;
    position:relative; overflow:hidden;
  }
  .page-bar{
    background:var(--band); color:var(--band-fg);
    padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex:none;
  }
  .page-bar .lockup .wordmark{font-size:12.5px}
  .page-bar .lockup .mark{width:26px; height:26px; border-radius:7px}
  .page-bar .lockup .mark svg{width:15px; height:15px}
  .page-tag{font-family:var(--mono); font-size:9.5px; font-weight:500; letter-spacing:.16em; text-transform:uppercase; opacity:.7}
  .page-body{padding:18mm 16mm 12mm; flex:1; display:flex; flex-direction:column; gap:16px}
  .page-foot{
    padding:8px 16mm 10mm; display:flex; justify-content:space-between; flex:none;
    font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted);
  }
  .page h2.page-title{
    margin:0; font-size:52px; font-weight:900; letter-spacing:-.02em; line-height:1;
    text-transform:uppercase; border-bottom:3px solid var(--ink); padding-bottom:8px;
  }
  .page .outcome{font-size:15px; padding:14px 16px; text-align:left; line-height:1.35}
  .page .block{border:none; padding:0}
  .page .block-label{font-size:10px; letter-spacing:.16em; margin-bottom:9px; color:var(--ink); font-weight:700}
  .page .rich{font-size:14px; line-height:1.55}
  .page .goals .rich li{padding-left:30px; margin:.55em 0; font-size:15px}
  .page .goals .rich li::before{width:20px; height:20px; font-size:11px}
  .page .sep{height:1px; background:var(--line); flex:none}
  .page .shots-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; margin-top:auto}
  .page .shots-row.one{grid-template-columns:minmax(0,56%)}
  .page .shots-row figure{margin:0; line-height:0; background:var(--surface)}
  .page .shots-row img{width:100%; height:210px; object-fit:cover; object-position:center 22%; display:block}
  .page .shots-row.one img{height:250px}
  .page .empty-note{
    font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--faint); border:1px dashed var(--line); padding:14px; text-align:center;
  }
  .page-edit{
    align-self:flex-start; margin-top:10px;
    font:inherit; font-size:11px; font-weight:600; background:none;
    border:1px solid var(--line); border-radius:2px; color:var(--muted);
    padding:7px 11px; min-height:32px; cursor:pointer;
  }
  .page-edit:hover{color:var(--ink); border-color:var(--ink)}
  .page-edit:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

  /* cover */
  .cover .page-body{gap:22px}
  .cover .year{
    font-size:96px; font-weight:900; letter-spacing:-.04em; line-height:.9; margin:0;
  }
  .cover .who{font-family:var(--mono); font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-2); margin:0}
  .cover .lede{font-family:var(--serif); font-style:italic; font-size:19px; line-height:1.4; color:var(--ink); margin:0}
  .cover .mathbox{background:var(--surface); padding:14px 16px}
  .cover .mathbox .block-label{margin-bottom:6px}
  .cover .mathbox p{margin:0; font-size:13.5px; line-height:1.55; color:var(--ink-2)}
  .cover .contents{display:flex; flex-direction:column; gap:0; margin-top:auto}
  .cover .row{display:grid; grid-template-columns:20px 92px 1fr; gap:12px; align-items:baseline; padding:11px 0; border-top:1px solid var(--line)}
  .cover .row:last-child{border-bottom:1px solid var(--line)}
  .cover .row .n{font-family:var(--mono); font-size:10px; color:var(--muted)}
  .cover .row .nm{font-size:13px; font-weight:900; letter-spacing:.02em; text-transform:uppercase}
  .cover .row .hd{font-size:12.5px; line-height:1.4; color:var(--ink-2)}
  .cover .row .hd:empty::before{content:'Not answered yet'; color:var(--faint); font-style:italic}

  @media (max-width:760px){
    .page{width:100%; min-height:0}
    .page-body{padding:24px 20px}
    .page-foot{padding:8px 20px 20px}
    .page h2.page-title{font-size:36px}
    .cover .year{font-size:64px}
  }
  @media print{
    .pages{padding:0; gap:0; display:block}
    .page{
      width:auto; min-height:auto; height:297mm; box-shadow:none;
      break-after:page; page-break-after:always; display:flex;
    }
    .page:last-child{break-after:auto; page-break-after:auto}
    .page-edit{display:none !important}
  }

  @media print{
    body{background:#fff}
    .toolbar,.wiz,.daily,.pillar-tools,.addcol,.shot .kill,.collage .hint{display:none !important}
    body{padding-bottom:0}
    .board{padding:0; overflow:visible}
    .sheet{box-shadow:none; border:none; width:auto; min-width:0}
    .pillars{grid-template-columns:repeat(var(--cols,5), minmax(0,1fr))}
    .pillar{padding:14px 10px; break-inside:avoid}
    .collage{border:none; padding:0}
    .is-empty::before{content:''}
    .sticky:has(.rich.is-empty){display:none}   /* no empty amber block on paper */

    /* Fill-by-hand variant: keep every prompt and photo box on the paper */
    .print-prompts .is-empty::before{content:attr(data-ph); color:var(--faint)}
    .print-prompts .collage{border:1px dashed var(--line); padding:6px; min-height:170px}
    .print-prompts .collage .hint{display:none !important}
    .print-prompts .collage::before{
      content:'Tape photos here'; grid-column:1 / -1;
      display:flex; align-items:center; justify-content:center;
      min-height:150px; color:var(--faint); font-size:11.5px; font-style:italic;
    }
    .print-prompts .outcome{min-height:64px}
    .print-prompts .block{min-height:120px}
  }

  /* ---------- comms: the ball-in-whose-court ledger ---------- */
  .comms{padding:10px 16px 24px; max-width:720px; margin:0 auto}
  .chead{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:10px 2px 12px}
  .cnum{font-size:46px; font-weight:900; letter-spacing:-.04em; line-height:1; color:var(--ink); font-variant-numeric:tabular-nums}
  .cnum small{font-size:14px; font-weight:600; letter-spacing:0; color:var(--ink-2); margin-left:8px}
  .cnum .over{color:var(--ink); background:var(--highlight); font-size:14px; font-weight:700; letter-spacing:0; padding:2px 7px; border-radius:2px; margin-left:8px; vertical-align:middle}
  .csub{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:8px 0 0; line-height:1.6}
  .csub.busy{color:var(--ink)}
  .csub.busy::before{content:''; display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--highlight); margin-right:7px; vertical-align:middle; animation:pulse 1.2s ease-in-out infinite}
  .csub.bad{color:var(--ink)}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  .csync{min-height:44px; padding:10px 16px; cursor:pointer; flex:none; margin-top:4px}
  .csync:disabled{opacity:.5; cursor:default}
  .cmsg{font-size:13px; color:var(--ink); padding:10px 12px; border:1px solid var(--highlight); background:rgba(242,165,22,.08); margin:0 0 10px; line-height:1.5}
  .clist{background:var(--sheet); border:1px solid var(--line); box-shadow:var(--shadow)}
  .cempty{font-size:15px; color:var(--ink-2); padding:26px 16px; text-align:center; line-height:1.5}
  .crow{border-top:1px solid var(--line)}
  .crow:first-child{border-top:none}
  .crow.is-busy{opacity:.5; pointer-events:none}
  .cmain{display:grid; grid-template-columns:48px 1fr; align-items:stretch}
  .ctickw{display:flex; align-items:center; justify-content:center; min-height:64px; cursor:pointer}
  .ctick{width:22px; height:22px; margin:0; accent-color:var(--ink); cursor:pointer}
  .ctick:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  .cbody{padding:14px 14px 14px 0; cursor:pointer; min-width:0}
  .cbody:focus-visible{outline:3px solid var(--accent); outline-offset:-3px}
  .cwhat{font-size:16px; font-weight:600; line-height:1.35; color:var(--ink); overflow-wrap:anywhere}
  .crow.is-done .cwhat{text-decoration:line-through; color:var(--ink-2); font-weight:500}
  .cwho{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); margin-top:5px; display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .cwho .due{color:var(--ink)}
  .cwho .over{background:var(--highlight); color:var(--ink); padding:1px 6px; border-radius:2px; font-weight:700}
  .cacts{display:none; gap:6px; padding:0 14px 12px 48px; flex-wrap:wrap}
  .crow.is-open .cacts{display:flex}
  .cacts .mini{min-height:42px; flex:1 1 auto; text-align:center; cursor:pointer}
  .cacts a.mini{display:inline-flex; align-items:center; justify-content:center; text-decoration:none}
  .cfold{border-top:1px solid var(--line)}
  .cfold summary{cursor:pointer; list-style:none; display:flex; align-items:center; justify-content:space-between; min-height:48px; padding:0 14px; font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2)}
  .cfold summary::-webkit-details-marker{display:none}
  .cfold summary:focus-visible{outline:3px solid var(--accent); outline-offset:-3px}
  .cfold summary .n{color:var(--ink); font-weight:700}
  .cfold[open] summary{color:var(--ink)}
  .cfolds{margin-top:12px; background:var(--sheet); border:1px solid var(--line); box-shadow:var(--shadow)}
  .cfolds .cfold:first-child{border-top:none}
  .cadd{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
  .cadd input[type=text]{flex:1 1 200px; font:inherit; font-size:16px; color:var(--ink); padding:10px 12px; min-height:46px; background:var(--sheet); border:1px solid var(--line-strong); border-radius:2px}
  .cadd input[type=date]{display:none; flex:0 1 150px; font:inherit; font-size:15px; color:var(--ink); padding:8px 10px; min-height:46px; background:var(--sheet); border:1px solid var(--line-strong); border-radius:2px}
  .cadd.is-live input[type=date]{display:block}
  .cadd input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .cadd .btn{min-height:46px; cursor:pointer; flex:0 0 auto}
  .cbox{display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; padding:12px 14px; border-top:1px solid var(--line); font-size:14px}
  .cbox b{display:block; font-weight:600}
  .cbox span{font-family:var(--mono); font-size:10px; letter-spacing:.06em; color:var(--ink-2); text-transform:uppercase}
  .cbox .st{font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); text-align:right}
  .cbox .st.ok{color:#1f8f1f}
  .cbox .st.bad{color:var(--ink); background:var(--highlight); padding:2px 6px; border-radius:2px}
  .ckey{display:flex; gap:8px; padding:12px 14px 14px; border-top:1px solid var(--line); flex-wrap:wrap}
  .ckey label{width:100%; font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
  .ckey input{flex:1 1 200px; font:inherit; font-size:16px; color:var(--ink); padding:10px 12px; min-height:46px; background:var(--sheet); border:1px solid var(--line-strong); border-radius:2px}
  .ckey input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .ckey .btn{min-height:46px; cursor:pointer}
  .ckey p{width:100%; margin:4px 0 0; font-size:12.5px; color:var(--ink-2); line-height:1.5}
  .skel{height:64px; background:linear-gradient(90deg,var(--surface),#eeeeeb,var(--surface)); background-size:200% 100%; animation:shimmer 1.2s linear infinite; border-top:1px solid var(--line)}
  @keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
  @media (prefers-reduced-motion:reduce){ .skel{animation:none} .csub.busy::before{animation:none} }
  @media (max-width:760px){
    .comms{padding:6px 12px 20px}
    .cnum{font-size:42px}
  }
  @media print{ .comms{display:none} }
  /* the phone's camera cut-out: paint the status bar navy and start the page below it */
  .safe-top{position:fixed; top:0; left:0; right:0; height:env(safe-area-inset-top); background:var(--ink); z-index:60; pointer-events:none}
  body{padding-top:env(safe-area-inset-top)}

  /* ===== TODAY + WEEK: plain, read-first ===== */
  body.has-nav{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  .bottomnav{position:fixed; left:0; right:0; bottom:0; z-index:40; display:flex; background:var(--sheet); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom)}
  .bottomnav button{flex:1; min-height:60px; border:none; background:none; font:inherit; font-size:11px; letter-spacing:.04em; color:var(--ink-2); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px}
  .bottomnav button svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
  .bottomnav button[aria-current="true"]{color:var(--ink); font-weight:700}
  .bottomnav .navwrap{display:flex; width:100%; max-width:720px; margin:0 auto}
  .plain{padding:22px 18px 40px; max-width:720px; margin:0 auto}
  .plain h2{margin:0; font-size:28px; font-weight:800; letter-spacing:-.03em; line-height:1.05}
  .plain .sub{margin:6px 0 0; font-size:13px; color:var(--ink-2); line-height:1.5}
  .plain .brief{margin:16px 0 0; padding:0; border:none; background:none; box-shadow:none; font-size:15px; line-height:1.55; color:var(--ink)}
  .plain .sec{margin-top:30px}
  .plain .sec-h{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px}
  .plain .sec-h .block-label{margin:0}
  .plain .sec-h a, .plain .sec-h button.link{font:inherit; font-size:12px; color:var(--ink-2); background:none; border:none; padding:0; cursor:pointer; text-decoration:underline; text-underline-offset:3px}
  .plain .msg{font-size:13px; color:var(--ink-2); margin:8px 0 0}
  .plain .msg.err{color:#c0392b}
  .plain .quiet{font-size:14px; color:var(--faint); padding:8px 0}
  /* today's three */
  .three{display:flex; flex-direction:column}
  .three label{display:grid; grid-template-columns:26px 1fr; gap:12px; align-items:start; padding:12px 0; border-top:1px solid var(--line); font-size:19px; font-weight:700; line-height:1.3; letter-spacing:-.01em; cursor:pointer}
  .three label:first-child{border-top:none}
  .three input{width:22px; height:22px; margin:3px 0 0; accent-color:var(--ink)}
  .three label.is-done{color:var(--faint); font-weight:500; text-decoration:line-through}
  .three-add{display:flex; gap:8px; margin-top:8px}
  .three-add input{flex:1; font:inherit; font-size:15px; padding:9px 11px; min-height:42px; border:1px solid var(--line-strong); border-radius:2px; background:var(--sheet); color:var(--ink); min-width:0}
  .three-add input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  /* the day: fixed commitments only */
  .hours{display:flex; flex-direction:column}
  .hour{display:grid; grid-template-columns:56px 1fr auto; gap:12px; align-items:baseline; padding:10px 0; border-top:1px solid var(--line); font-size:15px; line-height:1.4}
  .hour:first-child{border-top:none}
  .hour .t{font-family:var(--mono); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; padding-top:2px}
  .hour .l{min-width:0; overflow-wrap:anywhere}
  .hour .l .who{display:block; font-size:12px; color:var(--ink-2); margin-top:1px}
  .hour.is-past .l, .hour.is-past .t{color:var(--faint)}
  .hour.is-done .l{text-decoration:line-through; color:var(--faint)}
  .hour.is-now .t{color:var(--accent); font-weight:700}
  .hour .acts{display:flex; gap:12px; white-space:nowrap}
  .hour .acts a, .hour .acts button{font:inherit; font-size:12px; color:var(--ink-2); background:none; border:none; padding:0; cursor:pointer; text-decoration:underline; text-underline-offset:3px; min-height:auto}
  .hour-add{display:grid; grid-template-columns:76px 1fr auto; gap:8px; margin-top:10px}
  .hour-add input{font:inherit; font-size:15px; padding:9px 11px; min-height:42px; border:1px solid var(--line-strong); border-radius:2px; background:var(--sheet); color:var(--ink); min-width:0}
  .hour-add input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .hour-add .btn{min-height:42px; cursor:pointer}
  /* flags and owed, as plain lists */
  .plist{display:flex; flex-direction:column}
  .prow2{display:grid; grid-template-columns:22px 1fr; gap:10px; align-items:start; padding:9px 0; border-top:1px solid var(--line); font-size:15px; line-height:1.45}
  .prow2:first-child{border-top:none}
  .prow2 input{width:18px; height:18px; margin:4px 0 0; accent-color:var(--ink)}
  .prow2 .dot{width:10px; height:10px; border-radius:50%; margin:7px 0 0 4px}
  .prow2.money .dot{background:var(--highlight)} .prow2.risk .dot{background:#c0392b} .prow2.info .dot{background:var(--line-strong)} .prow2.win .dot{background:#37ca37}
  .prow2.is-done{color:var(--faint)} .prow2.is-done .tx{text-decoration:line-through}
  .prow2 .meta{display:block; font-family:var(--mono); font-size:10.5px; color:var(--muted); margin-top:2px; letter-spacing:.04em}
  .prow2 .meta.over{color:#c0392b; font-weight:700}
  .prow2 .who{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); display:block; margin-bottom:1px}
  .prow2 .acts{display:flex; gap:12px; margin-top:4px}
  .prow2 .acts a, .prow2 .acts button{font:inherit; font-size:12px; color:var(--ink-2); background:none; border:none; padding:0; cursor:pointer; text-decoration:underline; text-underline-offset:3px; min-height:auto}

(function(){

  /* =====================================================================

  var PILLAR_LIB = {
    HEALTH: {
      blurb:'Body, sleep, bloodwork, energy',
      outcome:{
        q:'On 31 December {year}, what is true about your body?',
        why:'Write the state, not the effort. Use numbers a doctor, a scale or a photo could confirm. If nobody else could score it on 31 December, it is a wish and not a target.',
        ex:[
          '12% bodyfat, resting heart rate under 55, full blood panel in range',

      plan:{
        q:'What are the few moves that produce that body?',
        why:'Three to five moves, one per line. Each one should be a decision you make once, not something you have to feel motivated about every morning.',
        ex:[
          'Hire a coach who writes the programme and checks the video\nBlood panel in January, repeat in June and December\nTrain at 06:30 before anything else can take the slot\nCut alcohol to occasions only, no weeknights',
          'Chef service delivering 5 days a week from February\nStrength 4x, zone 2 cardio 2x, same days every week\nSleep tracked, phone out of the bedroom\nDentist and skin sorted in Q1, not December'

      images:{
        q:'Which photos go in the Health column?',
        why:'This is the part people skip and it is the part that works. Your brain needs a reference image. A generic fitness photo gives it a generic reference, so use real ones wherever you can.',
        shots:[
          'You today. Front and side, same light, same spot you will reshoot in December.',
          'The target body on someone with your frame and age, not a magazine cover.',
          'The gym, the kitchen, or wherever the work actually happens.',
          'The number you are chasing: a blood panel, a scale, a lift on video.'
        ]
      },
      notes:{
        q:'What do you do every week, no matter how you feel?',
        why:'The outcome is not in your control. These are. State them as frequencies with no wiggle room, so that on a bad Tuesday there is nothing to negotiate.',
        ex:[
          '6 workouts a week, 2 of them cardio\nChef meal plan Monday to Friday, no deviation\nIn bed by 23:00, phone charges in the kitchen\nNo alcohol on a weeknight, ever',
          'Train before email, every weekday\n10,000 steps minimum, tracked\nSunday food prep, 90 minutes, in the calendar'
        ]
      }
    },

    WEALTH: {
      blurb:'Revenue, profit, the exit',
      outcome:{
        q:'On 31 December {year}, what does the money look like?',
        why:'One number and the shape it arrives in. Monthly revenue, profit kept, or a specific transaction. "Grow the business" is what people write in January and abandon in March.',
        ex:[
          '1M a month in revenue, agency exited, number one education brand in the space',
          '40k a month in profit, 12 clients at 5k retainer, 2 of them paid annually',
          '1,000 a month moved to savings, 12 months in a row, no exceptions'
        ]
      },
      plan:{
        q:'What are the few moves that produce that number?',
        why:'One line per move, with sub-steps underneath if a move needs them. The test: could someone else read this and know what you are doing on Monday?',
        ex:[
          'Pick one offer and stop selling the rest\nTen outreach messages a day, tracked in a sheet\nAsk for a raise or a new role at the mid-year review\nOne paid course or certification, finished by June',
          'Ship the productised version by end of Q1\nMove 3 biggest clients onto annual contracts\nCut the software stack by half, that is 5k a year straight to profit\nOpen a second market in Q3 once the first one is boring'
        ]
      },
      images:{
        q:'Which photos go in the Wealth column?',
        why:'Make the target concrete. Not a category like "nice office" but the actual office. Screenshots count, and are often better than photos.',
        shots:[
          'The office or desk you want to be working from.',
          'Your dashboard on the day it shows the number. Mock it up if you have to.',
          'The person or company already doing this, so the target has a face.',
          'The specific thing the money buys. The exact one, not a category.'
        ]
      },
      notes:{
        q:'What do you do every week regardless of how the month is going?',
        why:'These are the inputs you control. Written as frequencies and hard rules, so a slow month does not turn into a slow quarter.',
        ex:[
          '20 outbound calls a day, before anything else\nNo new offer until the current one has 10 paying clients\nEvery invoice out on the 1st, chased on the 7th\nNumbers reviewed every Monday morning, 30 minutes',

        ]
      }
    },

    LOVE: {
      blurb:'Partner, family, the people close in',
      outcome:{
        q:'What is true about your closest relationships on 31 December {year}?',
        why:'Write this one in the present tense, as if it has already happened. It reads strange and it works better than a milestone. Describe the ordinary week, not the wedding.',
        ex:[
          'Living together, and we cook at home most nights',

      images:{
        q:'Which photos go in the Love column?',
        why:'Real photos of real people beat anything staged. If the relationship is not here yet, use photos of the life you would live in it, not stock couples on a beach.',

          'The place you spend ordinary evenings, not holidays.',

      notes:{
        q:'What are the weekly non-negotiables here?',
        why:'This is the column people leave to whatever time is left over. Give it a slot before the work takes it.',

        ]
      }
    },

    NETWORK: {
      blurb:'The rooms you are in, the people in them',

        ex:[

      images:{
        q:'Which photos go in the Network column?',
        why:'Screenshots of the actual people are fine and better than generic conference photos. You want faces you would recognise across a room.',

          'The event or mastermind you intend to be at, with its dates.',

        q:'What do you do every week to keep this moving?',
        why:'Networks decay silently. These are the small repeated actions that stop that.',
        ex:[

    HAPPINESS: {
      blurb:'The ordinary week you would repeat',
      outcome:{
        q:'What does a good ordinary week look like by December {year}?',
        why:'Not the holiday. The week you would be content to repeat forty times. That is the honest test of whether the other four columns are pointed anywhere good.',
        ex:[
          'A trip with friends every season, and a weekend routine I actually look forward to',
          'Saturdays with no work in them, and the phone in a drawer until Sunday night',
          'Back in the mountains six times this year, and the book actually finished'

      plan:{
        q:'What has to be true for that week to exist?',
        why:'Usually one or two structural things: a place, a person, a boundary, or a booking made in advance. Name them.',

          'Book all four trips in January, before the year fills up\nSign the office lease in Q1 and stop working from the kitchen\nOne day a week completely off, defended like a client meeting',

      },
      images:{
        q:'Which photos go in the Happiness column?',
        why:'Pull from weeks you already loved. Photos from your own camera roll work better here than anything aspirational, because you know they are achievable.',
        shots:[
          'The place you go to switch off.',
          'The people you want more hours with.',
          'The room, the view or the ritual you keep meaning to get back to.',
          'A photo from a week you already loved, so you know it is real.'

      },
      notes:{
        q:'What protects that week when the year gets loud?',
        why:'Happiness is the column that quietly gets sacrificed to the wealth column. These are the rules that stop that trade being made by default.',
        ex:[
          'One trip booked before each quarter starts\nSunday is untouched by work\nPhone out of the bedroom\nNo meetings before 10:00 on a Monday',
          'Two weeks fully offline this year, booked in January\nOne evening a week that belongs to nothing productive'

      }

      blurb:'Skill, output, the work itself',
      outcome:{
        q:'What are you measurably better at on 31 December {year}?',
        why:'Skill goals rot into "get better at X". Attach an artefact: a thing you shipped, a level you reached, a piece of work you could show someone.',
        ex:[
          'Shipped 12 pieces of work I would put my name on publicly',
          'Fluent enough in the language to run a client call in it',
          'Built and launched the product myself, no contractor'

      plan:{q:'What is the practice that gets you there?',why:'Skill comes from reps with feedback. Say where the reps come from and who tells you when it is bad.',ex:['One piece shipped every week, published whether or not it is ready\nA coach or peer who reviews it honestly, monthly\nStudy an hour a day before the inbox opens']},
      images:{q:'Which photos go in this column?',why:'Show the standard you are aiming at, and where you are now, so the gap is visible.',shots:['Your work as it stands today.','Work by someone at the level you are aiming at.','The desk, studio or setup where the reps happen.','The finished thing you intend to be holding in December.']},
      notes:{q:'What are the weekly non-negotiables?',why:'Reps, stated as frequencies.',ex:['One hour of deliberate practice every weekday morning\nShip something every Friday, finished or not\nOne review session a month with someone better than me']}
    },

    FAMILY: {
      blurb:'Parents, kids, the people you came from',
      outcome:{
        q:'What is true about your family on 31 December {year}?',
        why:'This column is usually written in regrets afterwards. Write the state you want while there is still a year to produce it.',
        ex:[
          'My mother has stopped working and does not worry about money',

      plan:{q:'What has to happen for that to be true?',why:'Usually money, distance or calendar. Name which one and what you are doing about it.',ex:['Set up the standing transfer in January so it is not a monthly decision\nBook the flights for the whole year now\nMove the December trip to a month when I am not wrecked']},
      images:{q:'Which photos go in this column?',why:'Your own photos. This is the column where stock imagery is actively wrong.',shots:['The people, from a day that actually happened.','The house, the table, the place you all end up.','A photo you want to be able to take this year.','Something from a year you got this right.']},
      notes:{q:'What are the weekly non-negotiables?',why:'Small and repeated beats large and occasional.',ex:['Sunday call, same time, every week\nOne visit a quarter, booked in advance\nMoney sent on the 1st, automated']}
    },

    MIND: {
      blurb:'Head, faith, how you handle yourself',
      outcome:{
        q:'What is true about your head on 31 December {year}?',
        why:'Hard to measure, so anchor it to behaviour: what you do, how often, and what has stopped happening.',
        ex:[
          'Off the doom scroll: under an hour of phone a day, checked',
          'Six months of consistent therapy, and the thing I avoid has been said out loud',
          'A daily practice I have not missed for a month at a time'

      },
      plan:{q:'What produces that?',why:'Name the practice, the person and the removal. Most of this column is subtraction.',ex:['Weekly session booked for the whole year, paid up front\n20 minutes every morning before the phone\nDelete the two apps that eat the evenings']},
      images:{q:'Which photos go in this column?',why:'Use images of the state, not the concept. The chair you sit in, the walk you take, the view at 6am.',shots:['Where the practice happens.','A day you felt clear, photographed at the time.','The thing you are putting down.','The person or book that changed how you think.']},
      notes:{q:'What are the daily non-negotiables?',why:'Frequencies, not intentions.',ex:['20 minutes before the phone, every day\nNo screens for the first hour or the last hour\nWrite it down when it is loud instead of carrying it']}
    }

  };

      ex:[]
    },
    pillars:{

    },
    brief1:{
      q:'What is the honest read on where you are right now?',
      why:'Write this to yourself, not to an audience. Where you actually are, and the one thing that has to change. Nobody else reads this sheet.',
      ex:[
        'Last year I made more money and enjoyed it less. The business grew because I worked more hours, not because it got better. That does not work twice.',

      why:'The number at the top of the Wealth column is a claim. This is where you prove it. Price times units. Clients times retainer. Whatever turns the headline into something you could put on one line and check monthly.',
      ex:[

    links:{
      q:'Which documents does this board point at?',
      why:'The board is an index, not the plan. The detailed thinking lives in docs. List them here by name, one per line, and paste the links on the board afterwards if you want them clickable.',
      ex:['Yearly plan\nQuarterly map\nThe money math','2026 plan doc\nWeekly scorecard\nHiring plan\nExit memo']
    }
  };

  var IMG_SOURCE_HINT = 'Camera roll first. Screenshots of real people, real dashboards and real places all count. Use stock only where nothing real exists yet, and be specific when you do.';

  /* =====================================================================
     STATE
     ===================================================================== */

  var DEFAULT_PILLARS = ['HEALTH','WEALTH','LOVE','NETWORK','HAPPINESS'];

  function blankState(){
    return {
      owner:'', year:String(new Date().getFullYear()+1),
      links:'', brief1title:'Why this year is different', brief1:'',
      brief2title:'The math', brief2:'',
      pillars: DEFAULT_PILLARS.map(function(n,i){
        return {id:'p'+i, name:n, outcome:'', plan:'', notes:'', images:[]};
      }),
      step:0, interviewed:false
    };
  }
  /* Recovered from the 3 Sep session, used only when this browser has no saved board. (build-web.sh fills it from my-board.json) */
  var SEED = null;

  var state = blankState();

  function libFor(name){
    var k = (name||'').trim().toUpperCase();
    if(k==='HAPINESS') k='HAPPINESS';
    return PILLAR_LIB[k] || GENERIC;
  }
  function fill(str, p){
    return String(str||'')
      .replace(/\{year\}/g, state.year || 'this year')
      .replace(/\{P\}/g, p ? (p.name||'this area') : 'this area');
  }

  /* =====================================================================
     STORAGE
     ===================================================================== */

  var DB='warplan', STORE='board', KEY='current';
  function idb(){
    return new Promise(function(res,rej){
      try{
        var r=indexedDB.open(DB,1);
        r.onupgradeneeded=function(){ r.result.createObjectStore(STORE); };
        r.onsuccess=function(){ res(r.result); };
        r.onerror=function(){ rej(r.error); };
      }catch(e){ rej(e); }
    });
  }
  function load(){
    return idb().then(function(db){
      return new Promise(function(res){
        var q=db.transaction(STORE,'readonly').objectStore(STORE).get(KEY);
        q.onsuccess=function(){ res(q.result||null); };
        q.onerror=function(){ res(null); };
      });
    }).catch(function(){
      try{ var s=localStorage.getItem('warplan'); return s?JSON.parse(s):null; }catch(e){ return null; }
    });
  }
  var saveT=null;
  function save(){
    clearTimeout(saveT);
    saveT=setTimeout(function(){
      idb().then(function(db){
        var tx=db.transaction(STORE,'readwrite');
        tx.objectStore(STORE).put(state,KEY);
        tx.oncomplete=flash;
      }).catch(function(){
        try{ localStorage.setItem('warplan',JSON.stringify(state)); flash(); }
        catch(e){ el('saved').textContent='Not saved'; }
      });
    },400);
  }
  function flash(){
    var s=el('saved'); s.textContent='Saved';
    clearTimeout(flash.t); flash.t=setTimeout(function(){ s.textContent=''; },1400);
  }
  function el(id){ return document.getElementById(id); }

  /* =====================================================================
     TEXT HELPERS  (wizard writes plain lines, board stores HTML)
     ===================================================================== */

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function linesToList(txt){
    var lines=String(txt||'').split('\n').map(function(l){
      return l.replace(/^\s*[-*•]\s*/,'').trimEnd();
    }).filter(function(l){ return l.trim()!==''; });
    if(!lines.length) return '';
    return '<ul>'+lines.map(function(l){
      var indent=/^\s{2,}|^\t/.test(l);
      return '<li'+(indent?' style="margin-left:.9em"':'')+'>'+esc(l.trim())+'</li>';
    }).join('')+'</ul>';
  }
  function htmlToLines(html){
    if(!html) return '';
    var d=document.createElement('div');
    d.innerHTML=html;
    var items=d.querySelectorAll('li');
    if(items.length){
      return Array.prototype.map.call(items,function(li){ return li.textContent.trim(); }).join('\n');
    }
    return (d.textContent||'').trim();
  }
  function htmlToText(html){
    var d=document.createElement('div'); d.innerHTML=html||'';
    return (d.textContent||'').trim();
  }

  /* =====================================================================
     IMAGES
     ===================================================================== */

  function shrink(file){
    return new Promise(function(res,rej){
      var fr=new FileReader();
      fr.onload=function(){
        var img=new Image();
        img.onload=function(){
          var max=1400, w=img.width, h=img.height;
          if(w>max||h>max){ var k=Math.min(max/w,max/h); w=Math.round(w*k); h=Math.round(h*k); }
          var c=document.createElement('canvas'); c.width=w; c.height=h;
          c.getContext('2d').drawImage(img,0,0,w,h);
          res(c.toDataURL('image/jpeg',0.82));
        };
        img.onerror=rej; img.src=fr.result;
      };
      fr.onerror=rej; fr.readAsDataURL(file);
    });
  }
  function normImages(p){
    p.images=(p.images||[]).map(function(x){
      return typeof x==='string' ? {src:x, cap:''} : x;
    });
    return p.images;
  }
  function pickFiles(multiple){
    return new Promise(function(res){
      var i=document.createElement('input');
      i.type='file'; i.accept='image/*'; i.multiple=!!multiple;
      i.addEventListener('change',function(){ res(i.files); });
      i.click();
    });
  }
  function addImages(p, files, cap, replaceIdx){
    var jobs=[];
    for(var i=0;i<files.length;i++){
      if(files[i].type.indexOf('image/')===0) jobs.push(shrink(files[i]));
    }
    if(!jobs.length) return Promise.resolve();
    return Promise.all(jobs).then(function(urls){
      normImages(p);
      if(replaceIdx!=null && replaceIdx>-1){
        p.images[replaceIdx]={src:urls[0], cap:cap||''};
        urls.slice(1).forEach(function(u){ p.images.push({src:u, cap:''}); });
      }else{
        urls.forEach(function(u){ p.images.push({src:u, cap:cap||''}); });
      }
      save();
    });
  }

  /* =====================================================================
     STEP MODEL
     ===================================================================== */

  var FIELDS=[
    {field:'outcome', kind:'long',  label:'The headline outcome', sub:'Outcome'},
    {field:'plan',    kind:'lines', label:'One goal per line',    sub:'Goals'},
    {field:'images',  kind:'images',label:'',                     sub:'Photos'},
    {field:'notes',   kind:'lines', label:'One rule per line',    sub:'Non-negotiables'}
  ];

  function buildSteps(){
    var s=[
      {id:'owner',   kind:'short',   section:'Setup', spec:TOP.owner,   ph:'Your full name'},
      {id:'year',    kind:'short',   section:'Setup', spec:TOP.year,    ph:'2026'},
      {id:'pillars', kind:'pillars', section:'Setup', spec:TOP.pillars}
    ];
    state.pillars.forEach(function(p, pi){
      var lib=libFor(p.name);
      FIELDS.forEach(function(f){
        s.push({
          id:'p'+pi+'.'+f.field, kind:f.kind, section:p.name||'Column '+(pi+1),
          pillarIndex:pi, field:f.field, label:f.label, sub:f.sub, spec:lib[f.field]
        });
      });
    });
    s.push({id:'brief1', kind:'long',  section:'The frame', spec:TOP.brief1, label:'Written to yourself'});
    s.push({id:'brief2', kind:'long',  section:'The frame', spec:TOP.brief2, label:'Show the arithmetic'});
    s.push({id:'links',  kind:'lines', section:'The frame', spec:TOP.links,  label:'One document per line'});
    s.push({id:'done',   kind:'done',  section:'Done'});
    return s;
  }

  var steps=[];

  /* =====================================================================
     WIZARD RENDER
     ===================================================================== */

  function node(tag, cls, txt){
    var n=document.createElement(tag);
    if(cls) n.className=cls;
    if(txt!=null) n.textContent=txt;
    return n;
  }

  function currentValue(st){
    if(st.pillarIndex!=null){
      var p=state.pillars[st.pillarIndex];
      if(st.field==='images') return normImages(p);
      return st.kind==='lines' ? htmlToLines(p[st.field]) : htmlToText(p[st.field]);
    }
    if(st.kind==='lines') return htmlToLines(state[st.id]);
    return htmlToText(state[st.id]) || state[st.id] || '';
  }
  function commit(st, raw){
    var val = st.kind==='lines' ? linesToList(raw) : esc(raw).replace(/\n/g,'<br>');
    if(st.kind==='short') val=esc(raw);
    if(st.pillarIndex!=null) state.pillars[st.pillarIndex][st.field]=val;
    else state[st.id]=val;
    save();
  }

  function renderWizard(){
    steps=buildSteps();
    if(state.step>=steps.length) state.step=steps.length-1;
    if(state.step<0) state.step=0;
    var st=steps[state.step];

    /* progress */
    var track=el('track'); track.innerHTML='';
    steps.forEach(function(_,i){
      var seg=node('span','');
      if(i<state.step) seg.className='on';
      if(i===state.step) seg.className='now';
      track.appendChild(seg);
    });
    el('counter').textContent = st.kind==='done'
      ? 'Complete'
      : 'Question '+(state.step+1)+' of '+(steps.length-1);
    el('section').textContent = st.section || '';

    var host=el('qhost'); host.innerHTML='';
    if(st.kind==='done'){ host.appendChild(doneCard()); renderPreview(null); return; }

    var card=node('div','qcard');
    var eb=node('span', st.pillarIndex!=null ? 'eyebrow' : 'eyebrow plain',
      st.pillarIndex!=null ? (st.section+' — '+st.sub) : st.section);
    card.appendChild(eb);

    var p = st.pillarIndex!=null ? state.pillars[st.pillarIndex] : null;
    card.appendChild(node('h2','', fill(st.spec.q, p)));
    var why=node('p','why', fill(st.spec.why, p));
    card.appendChild(why);

    var body=node('div','field');
    var input=null;

    if(st.kind==='pillars'){
      body.appendChild(pillarPicker());
    }else if(st.kind==='images'){
      body.appendChild(imageStep(st, p));
    }else{
      if(st.label) { var lab=node('label','',st.label); lab.setAttribute('for','answer'); body.appendChild(lab); }
      input = st.kind==='short' ? document.createElement('input') : document.createElement('textarea');
      input.id='answer';
      input.value=currentValue(st);
      if(st.ph) input.placeholder=st.ph;
      if(st.kind==='lines') input.rows=7;
      if(st.kind==='long') input.rows=5;
      input.addEventListener('input', function(){
        commit(st, input.value);
        renderPreview(st);
        checkNudge(st, input.value, body);
      });
      body.appendChild(input);
      var nud=node('p','nudge'); nud.hidden=true; nud.id='nudge'; body.appendChild(nud);
      checkNudge(st, input.value, body);
    }
    card.appendChild(body);

    /* examples */
    if(st.spec && st.spec.ex && st.spec.ex.length && input){
      var ex=node('div','ex');
      ex.appendChild(node('div','ex-label','Examples of a good answer'));
      var list=node('div','ex-list');
      st.spec.ex.forEach(function(t){
        var b=node('button','ex-item',t);
        b.type='button';
        b.addEventListener('click', function(){
          input.value=t; input.focus();
          commit(st,t); renderPreview(st); checkNudge(st,t,body);
        });
        list.appendChild(b);
      });
      ex.appendChild(list);
      ex.appendChild(node('div','ex-hint','Click one to drop it in, then rewrite it until it is yours. These are shapes, not answers.'));
      card.appendChild(ex);
    }

    /* nav */
    var nav=node('div','wiz-nav');
    var back=node('button','btn ghost','Back'); back.type='button';
    back.disabled = state.step===0;
    back.addEventListener('click', function(){ go(-1); });
    var skip=node('button','btn ghost','Skip for now'); skip.type='button';
    skip.addEventListener('click', function(){ go(1); });
    var next=node('button','btn solid', state.step===steps.length-2 ? 'Finish' : 'Next'); next.type='button';
    next.addEventListener('click', function(){ go(1); });
    nav.appendChild(back);
    nav.appendChild(node('span','spacer'));
    nav.appendChild(node('span','kbd','Cmd or Ctrl + Enter for next'));
    nav.appendChild(skip);
    nav.appendChild(next);
    card.appendChild(nav);

    host.appendChild(card);
    renderPreview(st);
    if(input) setTimeout(function(){ input.focus(); },30);
  }

  function checkNudge(st, val, body){
    var nud=body.querySelector('#nudge');
    if(!nud) return;
    var msg='';
    var t=(val||'').trim();
    if(st.field==='outcome' && t && !/\d/.test(t)){
      msg='No number or date in there. Could someone else score this on 31 December and say yes or no?';
    }else if(st.field==='notes' && t && !/\d/.test(t)){
      msg='Add a frequency. "Train often" is a hope, "6 sessions a week" is a rule.';
    }else if(st.id==='brief2' && t && !/\d/.test(t)){
      msg='This one is meant to be arithmetic. Put the numbers in.';
    }else if(st.field==='plan' && t && t.split('\n').filter(function(l){return l.trim();}).length>7){
      msg='More than seven moves usually means this is a task list. Keep the moves, push the tasks into the doc.';
    }
    nud.textContent=msg; nud.hidden=!msg;
  }

  function pillarPicker(){
    var wrap=node('div','');
    var grid=node('div','picker');
    var presets=Object.keys(PILLAR_LIB);
    var custom=state.pillars.map(function(p){ return p.name.toUpperCase(); })
      .filter(function(n){ return presets.indexOf(n)===-1 && n; });
    presets.concat(custom).forEach(function(name){
      var on=state.pillars.some(function(p){ return p.name.toUpperCase()===name; });
      var lab=node('label','pick'+(on?' on':''));
      var cb=document.createElement('input'); cb.type='checkbox'; cb.checked=on;
      cb.addEventListener('change', function(){
        if(cb.checked){
          state.pillars.push({id:'p'+Date.now(), name:name, outcome:'', plan:'', notes:'', images:[]});
        }else{
          var i=state.pillars.findIndex(function(p){ return p.name.toUpperCase()===name; });
          if(i>-1) state.pillars.splice(i,1);
        }
        save(); renderWizard();
      });
      var txt=node('div','');
      txt.appendChild(node('b','',name));
      txt.appendChild(node('span','',(PILLAR_LIB[name]||GENERIC).blurb));
      lab.appendChild(cb); lab.appendChild(txt);
      grid.appendChild(lab);
    });
    wrap.appendChild(grid);

    var row=node('div','addown');
    var inp=document.createElement('input');
    inp.type='text'; inp.placeholder='Add your own, e.g. TRAVEL';
    inp.setAttribute('aria-label','Add your own pillar');
    var add=node('button','btn','Add column'); add.type='button';
    function doAdd(){
      var v=inp.value.trim().toUpperCase();
      if(!v) return;
      if(state.pillars.some(function(p){ return p.name.toUpperCase()===v; })) { inp.value=''; return; }
      state.pillars.push({id:'p'+Date.now(), name:v, outcome:'', plan:'', notes:'', images:[]});
      inp.value=''; save(); renderWizard();
    }
    add.addEventListener('click', doAdd);
    inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); doAdd(); } });
    row.appendChild(inp); row.appendChild(add);
    wrap.appendChild(row);

    var count=node('p','ex-hint', state.pillars.length+' column'+(state.pillars.length===1?'':'s')+' selected. Each one adds four questions.');
    wrap.appendChild(count);
    return wrap;
  }

  function imageStep(st, p){
    var wrap=node('div','');
    normImages(p);
    var shots=st.spec.shots||GENERIC.images.shots;

    var grid=node('div','shots');
    shots.forEach(function(cap, i){
      var found=p.images.findIndex(function(im){ return im.cap===cap; });
      var slot=node('button','shot-slot'+(found>-1?' filled':'')); slot.type='button';
      if(found>-1){
        var im=document.createElement('img');
        im.className='thumb'; im.src=p.images[found].src; im.alt=cap;
        slot.appendChild(im);
      }
      slot.appendChild(node('div','cap',cap));
      slot.appendChild(node('div','plus', found>-1 ? 'Replace' : 'Add photo'));
      slot.addEventListener('click', function(){
        pickFiles(false).then(function(files){
          if(!files || !files.length) return;
          return addImages(p, files, cap, found);
        }).then(function(){ renderWizard(); });
      });
      grid.appendChild(slot);
    });
    wrap.appendChild(grid);

    var extra=p.images.filter(function(im){ return shots.indexOf(im.cap)===-1; });
    var dz=node('div','dropzone','Drop any other photos here, or click to choose'
      + (extra.length ? '  ('+extra.length+' added)' : ''));
    dz.setAttribute('role','button'); dz.setAttribute('tabindex','0');
    dz.addEventListener('click', function(){
      pickFiles(true).then(function(files){
        if(!files || !files.length) return;
        return addImages(p, files, '');
      }).then(function(){ renderWizard(); });
    });
    dz.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); dz.click(); } });
    ['dragenter','dragover'].forEach(function(ev){ dz.addEventListener(ev,function(e){ e.preventDefault(); dz.classList.add('dragover'); }); });
    ['dragleave','drop'].forEach(function(ev){ dz.addEventListener(ev,function(e){ e.preventDefault(); dz.classList.remove('dragover'); }); });
    dz.addEventListener('drop', function(e){
      if(e.dataTransfer && e.dataTransfer.files) addImages(p, e.dataTransfer.files, '').then(renderWizard);
    });
    wrap.appendChild(dz);
    wrap.appendChild(node('p','ex-hint', IMG_SOURCE_HINT));
    return wrap;
  }

  function doneCard(){
    var c=node('div','done');
    var first=(htmlToText(state.owner)||'').trim().split(/\s+/)[0];
    c.appendChild(node('h2','', first ? first+', your warplan is ready' : 'Your warplan is ready'));
    c.appendChild(node('p','','Everything you answered is on the board. Every word on it stays editable, so you can keep working on it all year. Print it and put it where you will see it.'));

    var gaps=[];
    state.pillars.forEach(function(p){
      var missing=[];
      if(!htmlToText(p.outcome)) missing.push('headline');
      if(!htmlToText(p.plan)) missing.push('plan');
      if(!(p.images||[]).length) missing.push('photos');
      if(!htmlToText(p.notes)) missing.push('non-negotiables');
      if(missing.length) gaps.push(p.name+': no '+missing.join(', '));
    });
    if(!htmlToText(state.brief2)) gaps.push('The math is still empty');

    var row=node('div','row');
    var b1=node('button','btn solid','Open the board'); b1.type='button';
    b1.addEventListener('click', function(){ state.interviewed=true; save(); setMode('board'); });
    var b3=node('button','btn','One page per goal set'); b3.type='button';
    b3.addEventListener('click', function(){ state.interviewed=true; save(); setMode('pages'); });
    var b2=node('button','btn ghost','Back through the questions'); b2.type='button';
    b2.addEventListener('click', function(){ state.step=0; save(); renderWizard(); });
    row.appendChild(b1); row.appendChild(b3); row.appendChild(b2);
    c.appendChild(row);

    if(gaps.length){
      var g=node('div','gaps');
      g.appendChild(node('b','','Still open'));
      var ul=document.createElement('ul');
      gaps.forEach(function(t){ ul.appendChild(node('li','',t)); });
      g.appendChild(ul);
      g.appendChild(node('p','ex-hint','Gaps are fine on day one. A column with a headline and nothing else still beats no column.'));
      c.appendChild(g);
    }
    return c;
  }

  function go(dir){
    state.step=Math.max(0, Math.min(steps.length-1, state.step+dir));
    save(); renderWizard();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  /* =====================================================================
     LIVE PREVIEW
     ===================================================================== */

  function renderPreview(st){
    var host=el('previewHost');
    host.innerHTML='';
    var lab=node('div','preview-label');
    var frame=node('div','preview-frame');

    if(st && st.pillarIndex!=null){
      lab.appendChild(node('span','','Filling in'));
      lab.appendChild(node('span','',(state.pillars[st.pillarIndex].name||'')+' column'));
      var grid=node('div','pillars');
      grid.style.setProperty('--cols',1);
      grid.style.borderTop='none';
      grid.appendChild(pillarCard(state.pillars[st.pillarIndex], st.pillarIndex, true));
      frame.appendChild(grid);
    }else{
      lab.appendChild(node('span','','Your board so far'));
      lab.appendChild(node('span','', state.pillars.length+' columns'));
      var mini=node('div','');
      var band=node('div','band');
      var h=node('h1','', ((state.owner||'YOUR NAME')+' — WARPLAN '+(state.year||'')).toUpperCase());
      band.appendChild(h);
      mini.appendChild(band);
      var strip=node('div','strip'); strip.style.padding='16px';
      var sticky=node('div','sticky');
      var sr=node('div','rich'); sr.innerHTML=state.links||'<em>Documents</em>';
      sticky.appendChild(sr); strip.appendChild(sticky);
      [['brief1title','brief1'],['brief2title','brief2']].forEach(function(pair){
        var b=node('div','brief');
        var h3=document.createElement('h3');
        var m=document.createElement('mark'); m.textContent=htmlToText(state[pair[0]])||'—';
        h3.appendChild(m); b.appendChild(h3);
        var r=node('div','rich'); r.setAttribute('data-key',pair[1]);
        r.innerHTML=state[pair[1]]||'<em style="color:rgba(0,3,33,.32)">Not answered yet</em>';
        b.appendChild(r); strip.appendChild(b);
      });
      mini.appendChild(strip);
      frame.appendChild(mini);
    }
    host.appendChild(lab);
    host.appendChild(frame);
  }

  /* =====================================================================
     BOARD
     ===================================================================== */

  var X_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>';

  function markEmpty(n){
    var t=(n.textContent||'').trim();
    if(!t && !n.querySelector('img')){ n.innerHTML=''; n.classList.add('is-empty'); }
    else n.classList.remove('is-empty');
  }
  function bindEditable(n, get, set){
    n.setAttribute('contenteditable','true');
    n.innerHTML=get()||'';
    markEmpty(n);
    n.addEventListener('input', function(){ set(n.innerHTML); markEmpty(n); save(); });
    n.addEventListener('blur', function(){ markEmpty(n); });
    n.addEventListener('paste', function(e){
      e.preventDefault();
      var t=(e.clipboardData||window.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, t);
    });
  }
  function blockOf(label, ph, get, set, readonly, extra){
    var b=node('div','block'+(extra?' '+extra:''));
    b.appendChild(node('div','block-label',label));
    var r=node('div','rich'); r.setAttribute('data-ph',ph);
    if(readonly){ r.innerHTML=get()||''; markEmpty(r); }
    else bindEditable(r,get,set);
    b.appendChild(r);
    return b;
  }
  function miniBtn(label, fn){
    var b=node('button','mini',label); b.type='button';
    b.addEventListener('click', fn);
    return b;
  }

  var PH={
    outcome:'ONE SENTENCE. THE STATE YOU ARE IN ON 31 DEC.',
    plan:'The goals that produce the headline. One per line.',
    notes:'The inputs you control, as frequencies.'
  };

  function pillarCard(p, i, readonly){
    normImages(p);
    var sec=node('section','pillar');

    var h=node('h2',''); h.setAttribute('data-ph','PILLAR');
    if(readonly){ h.textContent=p.name||''; markEmpty(h); }
    else bindEditable(h, function(){ return p.name; }, function(v){ p.name=v; });
    sec.appendChild(h);

    var out=node('div','outcome'); out.setAttribute('data-ph',PH.outcome);
    if(readonly){ out.innerHTML=p.outcome||''; markEmpty(out); }
