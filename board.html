  function collage(p, readonly){
    var wrap=node('div','collage');
    if(!p.images.length){
      wrap.appendChild(node('div','hint','No photos yet. Drop them here, or answer the photo question.'));
    }
    p.images.forEach(function(im, idx){
      var fig=node('figure','shot'+(p.images.length%2===1 && idx===p.images.length-1 ? ' wide':''));
      var img=document.createElement('img');
      img.src=im.src; img.alt=im.cap || (p.name+' reference image '+(idx+1)); img.loading='lazy';
      fig.appendChild(img);
      if(!readonly){
        var kill=node('button','kill'); kill.type='button';
        kill.setAttribute('aria-label','Remove image '+(idx+1)+' from '+p.name);
        kill.innerHTML=X_ICON;
        kill.addEventListener('click', function(e){
          e.stopPropagation(); p.images.splice(idx,1); save(); renderBoard();
        });
        fig.appendChild(kill);
      }
      wrap.appendChild(fig);
    });
    if(readonly) return wrap;

    wrap.style.cursor='pointer';
    wrap.addEventListener('click', function(e){
      if(e.target.closest('.kill')) return;
      pickFiles(true).then(function(files){
        if(!files||!files.length) return;
        return addImages(p, files, '');
      }).then(renderBoard);
    });
    ['dragenter','dragover'].forEach(function(ev){ wrap.addEventListener(ev,function(e){ e.preventDefault(); wrap.classList.add('dragover'); }); });
    ['dragleave','drop'].forEach(function(ev){ wrap.addEventListener(ev,function(e){ e.preventDefault(); wrap.classList.remove('dragover'); }); });
    wrap.addEventListener('drop', function(e){
      if(e.dataTransfer && e.dataTransfer.files) addImages(p, e.dataTransfer.files, '').then(renderBoard);
    });
    return wrap;
  }

     THE DAILY LOOP
     A schedule is a plan. What changes behaviour is a short loop you close
     every day and can see the shape of over a week. This is that loop.

  var DEFAULT_DAY = [
    {id:'b1',  t:'06:30', label:'Up. Water. Phone stays in the other room.', pillar:'MIND',      days:'daily'},
    {id:'b2',  t:'06:45', label:'Meditate, 20 minutes',                      pillar:'MIND',      days:'daily'},
    {id:'b3',  t:'07:10', label:'Journal: yesterday out, today in',          pillar:'MIND',      days:'daily'},
    {id:'b4',  t:'07:25', label:'Write the 3 big wins for today',            pillar:'WEALTH',    days:'weekdays'},
    {id:'b5',  t:'07:45', label:'Train',                                     pillar:'HEALTH',    days:'mon,tue,thu,sat'},
    {id:'b6',  t:'07:45', label:'Jump rope',                                 pillar:'HEALTH',    days:'wed,fri,sun'},
    {id:'b7',  t:'09:30', label:'Deep work: big win 1, nothing else open',   pillar:'WEALTH',    days:'weekdays'},
    {id:'b8',  t:'11:30', label:'Outbound and sales calls',                  pillar:'WEALTH',    days:'weekdays'},
    {id:'b9',  t:'13:00', label:'Eat. Protein first.',                       pillar:'HEALTH',    days:'daily'},
    {id:'b10', t:'14:00', label:'Team check-in, delivery, unblock people',   pillar:'WEALTH',    days:'weekdays'},
    {id:'b11', t:'16:00', label:'Post something, or ask for one intro',      pillar:'NETWORK',   days:'weekdays'},
    {id:'b12', t:'17:00', label:'Admin and money',                           pillar:'WEALTH',    days:'weekdays'},
    {id:'b13', t:'18:30', label:'Walk. Close the 10k steps.',                pillar:'HEALTH',    days:'daily'},
    {id:'b14', t:'20:00', label:'Laptop shut. Phone down.',                  pillar:'LOVE',      days:'daily'},
    {id:'b15', t:'21:30', label:'Check out: what got done, tomorrow set',    pillar:'MIND',      days:'daily'},
    {id:'b16', t:'23:00', label:'Bed',                                       pillar:'HEALTH',    days:'daily'}
  ];

  var DAY_NAMES=['sun','mon','tue','wed','thu','fri','sat'];

  function todayKey(d){
    d = d || new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function dayOf(key){
    var p=key.split('-');
    return new Date(+p[0], +p[1]-1, +p[2]);
  }
  function runsOn(block, date){
    var nm=DAY_NAMES[date.getDay()];
    if(block.days==='daily') return true;
    if(block.days==='weekdays') return nm!=='sat' && nm!=='sun';
    if(block.days==='weekends') return nm==='sat' || nm==='sun';
    return block.days.split(',').map(function(x){return x.trim();}).indexOf(nm)>-1;
  }
  function ensureDay(){
    if(!state.day) state.day={ blocks:JSON.parse(JSON.stringify(DEFAULT_DAY)), log:{}, wins:{} };
    if(!state.day.blocks || !state.day.blocks.length) state.day.blocks=JSON.parse(JSON.stringify(DEFAULT_DAY));
    if(!state.day.log) state.day.log={};
    if(!state.day.wins) state.day.wins={};
    return state.day;
  }
  var viewDate = todayKey();

  function pillarColor(name){
    var map={HEALTH:'#0038ff', WEALTH:'#F2A516', LOVE:'#c2417d', NETWORK:'#0f9b8e', HAPPINESS:'#7a5cd6', MIND:'#4a5268', TRAVEL:'#c0562b'};
    return map[(name||'').toUpperCase()] || '#4a5268';
  }

  function dayStats(key){
    var day=ensureDay(), date=dayOf(key);
    var due=day.blocks.filter(function(b){ return runsOn(b,date); });
    var log=day.log[key]||{};
    var done=due.filter(function(b){ return log[b.id]; }).length;
    return {due:due.length, done:done, pct: due.length ? Math.round(done/due.length*100) : 0};
  }
  function lastNDays(n){
    var out=[], d=new Date();
    for(var i=n-1;i>=0;i--){
      var x=new Date(d.getFullYear(), d.getMonth(), d.getDate()-i);
      out.push(todayKey(x));
    }
    return out;
  }
  function streak(){
    var n=0, d=new Date();
    for(var i=0;i<400;i++){
      var k=todayKey(new Date(d.getFullYear(), d.getMonth(), d.getDate()-i));
      var st=dayStats(k);
      if(i===0 && st.done===0) continue;      /* today not started yet does not break it */
      if(st.due && st.pct>=70) n++; else break;
    }
    return n;
  }

  function renderDaily(){
    var host=el('dailyView');
    host.innerHTML='';
    var day=ensureDay();
    var key=viewDate, date=dayOf(key);

    nav.appendChild(miniBtn('Previous day', function(){ viewDate=shiftDay(key,-1); renderDaily(); }));
    if(!isToday) nav.appendChild(miniBtn('Today', function(){ viewDate=todayKey(); renderDaily(); }));
    nav.appendChild(miniBtn('Next day', function(){ viewDate=shiftDay(key,1); renderDaily(); }));

    main.appendChild(head);

    /* three big wins */
    var winsBox=node('div','wins');
    winsBox.appendChild(node('div','block-label','The 3 big wins for today'));
    [0,1,2].forEach(function(i){

      inp.value=(day.wins[key]||[])[i]||'';
      inp.addEventListener('input', function(){

        w[i]=inp.value; day.wins[key]=w; save();

      row.appendChild(n); row.appendChild(inp);
      winsBox.appendChild(row);
    });
    main.appendChild(winsBox);

    /* ---------- flags ---------- */
    var fg=node('div','tcard');
    var flags=((d && d.flags)||[]).slice().sort(function(a,b){ return (a.done-b.done) || ((a.due||'9999')<(b.due||'9999')?-1:1); });
    var gh2=node('div','group-head'); gh2.appendChild(node('div','block-label','Do not miss')); gh2.appendChild(node('span','group-count', String(flags.filter(function(x){ return !x.done; }).length)));
    fg.appendChild(gh2);
    if(!flags.length) fg.appendChild(node('div','empty','Nothing flagged.'));
    var fls=node('div','flags');
    flags.forEach(function(x){
      var row=node('label','flag '+x.kind+(x.done?' is-done':''));
      var cb=document.createElement('input'); cb.type='checkbox'; cb.checked=!!x.done;
      cb.addEventListener('change', function(){ todayWrite({op:'patch', kind:'flag', id:x.id, changes:{done:cb.checked}}, row); });
      row.appendChild(cb); row.appendChild(node('span','fdot'));
      var tx=node('span','ftext', x.text);
      if(x.due) tx.appendChild(node('span','fdue'+(x.due<key && !x.done?' over':''), x.due<key ? 'was due '+x.due : x.due===key ? 'today' : x.due));
      row.appendChild(tx);
      fls.appendChild(row);
    });
    fg.appendChild(fls);
    var ff=document.createElement('form'); ff.className='add-form';
    var ffT=document.createElement('input'); ffT.type='text'; ffT.placeholder='Flag something: a payment, a risk, a date'; ffT.setAttribute('aria-label','Flag'); ffT.autocomplete='off';
    var ffD=document.createElement('input'); ffD.type='date'; ffD.setAttribute('aria-label','Due');
    var two2=node('div','two'); two2.appendChild(ffT); two2.appendChild(ffD); ff.appendChild(two2);
    var ffB=document.createElement('button'); ffB.type='submit'; ffB.className='btn ghost'; ffB.textContent='Add a flag'; ff.appendChild(ffB);
    ff.addEventListener('submit', function(ev){ ev.preventDefault(); var t=ffT.value.trim(); if(!t) return; todayWrite({op:'add', kind:'flag', item:{text:t, due:ffD.value||null, kind:'info'}}); });
    fg.appendChild(ff);
    main.appendChild(fg);

    /* the blocks */
    var due=day.blocks.filter(function(b){ return runsOn(b,date); })
                      .sort(function(a,b){ return a.t.localeCompare(b.t); });
    var list=node('div','blocks');
    due.forEach(function(b){
      var row=node('label','blk'+(log[b.id]?' is-done':''));
      var cb=document.createElement('input');
      cb.type='checkbox'; cb.checked=!!log[b.id];
      cb.addEventListener('change', function(){
        if(cb.checked) log[b.id]=true; else delete log[b.id];
        save(); renderDaily();
      });
      var tm=node('span','blk-t', b.t);
      var lb=node('span','blk-l', b.label);
      var dot=node('span','blk-dot'); dot.style.background=pillarColor(b.pillar);
      dot.title=b.pillar;
      row.appendChild(cb); row.appendChild(tm); row.appendChild(lb); row.appendChild(dot);
      list.appendChild(row);
    });
    main.appendChild(list);
    main.appendChild(node('p','ex-hint','Tick as you go, not at the end of the day. The point is the loop closing, not the record being tidy.'));
    wrap.appendChild(main);

    /* ---------- right: the score ---------- */
    var side=node('div','daily-side');
    var st=dayStats(key);

    var score=node('div','scorecard');
    score.appendChild(node('div','block-label','Today'));
    var big=node('div','score-big', st.done+'/'+st.due);
    score.appendChild(big);
    var bar=node('div','bar'); var fill=node('div','bar-fill');
    fill.style.width=st.pct+'%';
    fill.style.background = st.pct>=70 ? '#37ca37' : (st.pct>=40 ? 'var(--highlight)' : 'var(--line-strong)');
    bar.appendChild(fill); score.appendChild(bar);
    score.appendChild(node('div','score-note', st.pct+'% of what today asked for'));
    var sk=streak();
    score.appendChild(node('div','score-note', sk ? sk+' day'+(sk===1?'':'s')+' at 70% or better' : 'No streak running. One day starts one.'));
    side.appendChild(score);

    /* last 14 days */
    var hist=node('div','scorecard');
    hist.appendChild(node('div','block-label','Last 14 days'));
    var strip=node('div','day-strip');
    lastNDays(14).forEach(function(k){
      var s2=dayStats(k);
      var cell=node('span','cell');
      cell.title=k+' — '+s2.done+'/'+s2.due;
      cell.style.background = !s2.due ? 'var(--surface)'
        : s2.pct>=70 ? '#37ca37' : s2.pct>=40 ? 'var(--highlight)' : s2.pct>0 ? 'rgba(0,3,33,.25)' : 'var(--surface)';
      if(k===key) cell.classList.add('now');
      cell.addEventListener('click', function(){ viewDate=k; renderDaily(); });
      strip.appendChild(cell);
    });
    hist.appendChild(strip);
    side.appendChild(hist);

    /* per-pillar adherence over 14 days */
    var byP=node('div','scorecard');
    byP.appendChild(node('div','block-label','By area, last 14 days'));
    var names={};
    day.blocks.forEach(function(b){ names[b.pillar]=true; });
    Object.keys(names).forEach(function(pn){
      var due2=0, done2=0;
      lastNDays(14).forEach(function(k){
        var dt=dayOf(k), lg=day.log[k]||{};
        day.blocks.forEach(function(b){
          if(b.pillar!==pn || !runsOn(b,dt)) return;
          due2++; if(lg[b.id]) done2++;
        });
      });
      var pct=due2?Math.round(done2/due2*100):0;
      var r=node('div','prow');
      var dot=node('span','blk-dot'); dot.style.background=pillarColor(pn);
      r.appendChild(dot);
      r.appendChild(node('span','pname',pn));
      var pb=node('span','pbar'); var pf=node('span','pbar-fill');
      pf.style.width=pct+'%'; pf.style.background=pillarColor(pn);
      pb.appendChild(pf); r.appendChild(pb);
      r.appendChild(node('span','ppct',pct+'%'));
      byP.appendChild(r);
    });
    side.appendChild(byP);

    /* the money, straight from the dashboard */
    if(MONEY && MONEY.months && MONEY.months.length){
      var m=MONEY.months[MONEY.months.length-1];
      var mc=node('div','scorecard money');
      mc.appendChild(node('div','block-label','The money, '+m.m));

      side.appendChild(mc);

    wrap.appendChild(side);
    host.appendChild(wrap);
  }

  function moneyRow(label, actual, target){
    var r=node('div','mrow');
    r.appendChild(node('span','mlabel',label));
    var v=node('span','mval', Math.round(actual).toLocaleString()+' / '+target.toLocaleString());
    r.appendChild(v);

    var pct=Math.max(2, Math.min(100, Math.round(actual/target*100)));
    f.style.width=pct+'%';
    b.appendChild(f); r.appendChild(b);
    r.appendChild(node('span','mpct', Math.round(actual/target*100)+'%'));

  function shiftDay(key, n){

     One number, one list, one tap. Tap a row for its actions.
     Helper names commsStats / commsSort / relDue / commsApi / commsWrite /
     commsCacheLoad / COMMS.data are used by the Today tab too. Keep them.
     ===================================================================== */
  var COMMS = { data:null, err:'', loading:false, syncing:false, syncTimer:null, syncSince:null, openId:null };
  var COMMS_HOSTED = location.protocol.indexOf('http')===0;

  function commsCacheLoad(){ try{ var s=localStorage.getItem('warplan_comms'); return s?JSON.parse(s):null; }catch(e){ return null; } }
  function commsCacheSave(d){ try{ localStorage.setItem('warplan_comms', JSON.stringify(d)); }catch(e){} }

  function commsApi(method, body){
    return fetch('/api/comms', {

      headers: body ? {'content-type':'application/json'} : undefined,

    commsApi('POST',{op:'requestSync'}).then(function(d){ COMMS.data=d; commsCacheSave(d); commsSyncPoll(0); })

  function commsSyncPoll(n){
    COMMS.syncTimer=setTimeout(function(){
      commsApi('GET').then(function(d){
        COMMS.data=d; commsCacheSave(d);

        if(s.finishedAt && s.finishedAt>COMMS.syncSince){ commsSyncStop(); if(s.error) COMMS.err='Sync failed on the Mac: '+s.error; }

  function commsStats(d){
    var t=todayKey();
    var live=function(i){ return i.status==='open' && !(i.snoozedUntil && i.snoozedUntil>t); };
    var mine=d.items.filter(function(i){ return live(i) && i.ball==='me'; });
    var theirs=d.items.filter(function(i){ return live(i) && i.ball==='them'; });
    var snoozed=d.items.filter(function(i){ return i.status==='open' && i.snoozedUntil && i.snoozedUntil>t; });
    var overdue=mine.filter(function(i){ return i.due && i.due<t; });
    var keys=Object.keys(d.days||{}).sort(), streak=0;
    for(var k=keys.length-1;k>=0;k--){ var x=d.days[keys[k]]; if(x && x.overdue===0) streak++; else break; }
    var closed=d.items.filter(function(i){ return i.status==='done' && i.doneAt && daysBetween(i.doneAt.slice(0,10), t)<=7; })
                      .sort(function(a,b){ return a.doneAt<b.doneAt?1:-1; });

  function commsSort(a,b){

  function daysBetween(a,b){ return Math.round((dayOf(b)-dayOf(a))/86400000); }

  function ageOf(iso, t){

  var TODAY = { data:null, err:'', loading:false, editing:null, open:{} };
  var TODAY_HOSTED = location.protocol.indexOf('http')===0;
  var ROUTINE_RE = /Morning OS|Evening OS|Admin \+ Money|Deep Work Sprint|Weekly Strategic Review/i;

  function todayCacheLoad(){ try{ var s=localStorage.getItem('warplan_today'); return s?JSON.parse(s):null; }catch(e){ return null; } }
  function todayCacheSave(d){ try{ localStorage.setItem('warplan_today', JSON.stringify(d)); }catch(e){} }
  function todayApi(method, body){
    return fetch('/api/today', {
      method:method, credentials:'same-origin',
      headers: body ? {'content-type':'application/json'} : undefined,
      body: body ? JSON.stringify(body) : undefined
    }).then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error || ('HTTP '+r.status)); return j; }); });
  }

  function todayLoad(){
    if(!TODAY_HOSTED){ TODAY.err='This view needs the hosted app. Open your deployed Warplan URL.'; rerenderPlain(); return; }
    TODAY.loading=true; TODAY.err=''; rerenderPlain();
    var a=todayApi('GET').then(function(d){ TODAY.data=d; todayCacheSave(d); }).catch(function(e){ TODAY.err='Could not load: '+e.message; });
    var b=commsApi('GET').then(function(d){ COMMS.data=d; commsCacheSave(d); }).catch(function(){});
    Promise.all([a,b]).then(function(){ TODAY.loading=false; rerenderPlain(); });
  }
  function todayWrite(body, rowEl){

      .catch(function(e){ TODAY.err='Change not saved: '+e.message; })
      .then(function(){ TODAY.editing=null; rerenderPlain(); });
  }
  function fmtTime(iso){

  }
  function evKey(e){ if(!e.start) return ''; if(e.start.length<=10) return e.start; return todayKey(new Date(e.start)); }

  function renderFlags(host, d, key, onlyUrgent){
    var flags=((d && d.flags)||[]).filter(function(x){ return !x.done; });
    if(onlyUrgent) flags=flags.filter(function(x){ return x.kind==='money' || x.kind==='risk' || (x.due && x.due<=shiftDay(key,1)); });
    flags.sort(function(a,b){ return ((a.due||'9999')<(b.due||'9999'))?-1:1; });
    var list=node('div','plist');
    if(!flags.length) list.appendChild(node('div','quiet','Nothing.'));
    flags.forEach(function(x){ list.appendChild(flagRow(x, key)); });
    host.appendChild(list);
  }

  /* ---------- owed (comms) ---------- */
  function owedRow(i, st){
    var over = i.due && i.due<st.t;
    var row=node('div','prow2 info');
    row.appendChild(node('span','dot'));
    var tx=node('span','tx'); tx.appendChild(node('span','who', i.counterparty||''));
    tx.appendChild(document.createTextNode(i.action || i.subject || ''));
    if(i.due) tx.appendChild(node('span','meta'+(over?' over':''), relDue(i.due, st.t)));
    var acts=node('span','acts');
    acts.appendChild(textBtn('Done', function(){ commsWrite({op:'patch', id:i.id, changes:{status:'done'}}, row); }));
    acts.appendChild(textBtn('Ball to them', function(){ commsWrite({op:'patch', id:i.id, changes:{ball:'them', snoozedUntil:null}}, row); }));
    if(i.url) acts.appendChild(linkBtn('Open', i.url));
    tx.appendChild(acts); row.appendChild(tx); return row;
  }

  /* ===================== TODAY ===================== */
  function renderToday(){
    var host=el('todayView'); host.innerHTML='';
    var d=TODAY.data || todayCacheLoad(); var cd=COMMS.data || commsCacheLoad();
    var key=todayKey();
    var wrap=node('div','plain');
    wrap.appendChild(node('h2','', niceDate(key)));
    var fetched = d && d.calendar && d.calendar.fetchedAt ? new Date(d.calendar.fetchedAt) : null;
    var sub=node('p','sub', fetched ? 'Synced '+fetched.toLocaleString('en-GB',{weekday:'short', hour:'2-digit', minute:'2-digit'})+'. ' : 'No feed yet. ');
    var rb=document.createElement('button'); rb.type='button'; rb.className='link'; rb.style.cssText='font:inherit;font-size:13px;color:var(--ink-2);background:none;border:none;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px';
    rb.textContent=TODAY.loading?'Refreshing':'Refresh'; rb.addEventListener('click', function(){ todayLoad(); }); sub.appendChild(rb);
    wrap.appendChild(sub);
    if(TODAY.err) wrap.appendChild(node('p','msg err', TODAY.err));
    if(COMMS.err) wrap.appendChild(node('p','msg err', COMMS.err));
    if(d && d.brief) wrap.appendChild(node('p','brief', d.brief));

    renderThree(section(wrap,'The three that make today'), d, key);
    renderHours(section(wrap,'The hours'), d, key);
    renderFlags(section(wrap,'Do not miss', textBtn('All flags', function(){ setMode('week'); })), d, key, true);

    var st = cd ? commsStats(cd) : null;
    var owedSec=section(wrap,'Needs a reply'+(st?' · '+st.mine.length:''), textBtn('Comms', function(){ setMode('comms'); }));
    if(!cd) owedSec.appendChild(node('div','quiet', TODAY.loading ? 'Loading.' : 'No ledger yet.'));
    else if(!st.mine.length) owedSec.appendChild(node('div','quiet','Nothing owed.'));
    else {
      var list=node('div','plist');
      st.mine.slice().sort(commsSort).slice(0,4).forEach(function(i){ list.appendChild(owedRow(i, st)); });
      owedSec.appendChild(list);
      if(st.mine.length>4) owedSec.appendChild(node('p','msg', (st.mine.length-4)+' more under Comms.'));
    }
    host.appendChild(wrap);
  }

  /* ===================== WEEK ===================== */
  function renderWeek(){
    var host=el('weekView'); host.innerHTML='';
    var d=TODAY.data || todayCacheLoad();
    var key=todayKey();
    var wrap=node('div','plain');
    wrap.appendChild(node('h2','','This week'));
    wrap.appendChild(node('p','sub', d && d.updated ? 'Plan updated '+new Date(d.updated).toLocaleString('en-GB',{weekday:'short', hour:'2-digit', minute:'2-digit'})+'. The Sunday recap rewrites it; edit anything here.' : 'No plan yet.'));
    if(TODAY.err) wrap.appendChild(node('p','msg err', TODAY.err));
    if(d && d.brief) wrap.appendChild(node('p','brief', d.brief));

    /* fronts */
    var fronts=((d && d.fronts)||[]).slice().sort(function(a,b){ return (a.status==='done')-(b.status==='done') || a.order-b.order; });
    var fs=section(wrap,'Fronts · '+fronts.filter(function(f){ return f.status!=='done'; }).length);
    var fl=node('div','fronts');
    if(!fronts.length) fl.appendChild(node('div','quiet','No fronts yet.'));
    fronts.forEach(function(f){ fl.appendChild(frontCard(f, key)); });
    fs.appendChild(fl);
    var af=document.createElement('form'); af.className='add-form';
    var afName=document.createElement('input'); afName.type='text'; afName.placeholder='New front'; afName.setAttribute('aria-label','Front name'); afName.autocomplete='off';
    var afNext=document.createElement('input'); afNext.type='text'; afNext.placeholder='The next move'; afNext.setAttribute('aria-label','Next move'); afNext.autocomplete='off';
    var two=node('div','two'); two.appendChild(afName); two.appendChild(afNext); af.appendChild(two);
    var afB=document.createElement('button'); afB.type='submit'; afB.className='btn ghost'; afB.textContent='Add a front'; af.appendChild(afB);
    af.addEventListener('submit', function(ev){ ev.preventDefault(); var n=afName.value.trim(); if(!n) return; todayWrite({op:'add', kind:'front', item:{name:n, next:afNext.value.trim(), order:90}}); });
    fs.appendChild(af);

    /* the days ahead, with each day's three */
    var ws=section(wrap,'The days');
    var evs=((d && d.calendar && d.calendar.events)||[]).filter(function(e){ return !ROUTINE_RE.test(e.title); });
    var days=node('div','week-days');
    for(var i=0;i<7;i++){
      var k=shiftDay(key,i), dd=dayOf(k);
      var row=node('div','week-day');
      var wd=node('span','wd', dd.toLocaleDateString('en-GB',{weekday:'short'})); wd.appendChild(node('b','', String(dd.getDate()))); row.appendChild(wd);
      var col=node('div','');
      var wins=(d && d.wins && d.wins[k])||[];
      if(wins.length){ var tm=node('span','three-mini', wins.map(function(w){ return (w.done?'✓ ':'')+w.t; }).join(' · ')); col.appendChild(tm); }
      var these=evs.filter(function(e){ return evKey(e)===k; });
      if(!these.length && !wins.length) col.appendChild(node('div','week-ev quiet','Clear'));
      these.forEach(function(e){ var r=node('div','week-ev'); r.appendChild(node('span','t', e.allDay?'day':fmtTime(e.start))); r.appendChild(node('span','', e.title)); col.appendChild(r); });
      row.appendChild(col); days.appendChild(row);
    }
    ws.appendChild(days);

    /* every flag */
    var fg=section(wrap,'Flags');
    renderFlags(fg, d, key, false);
    var ff=document.createElement('form'); ff.className='add-form';
    var ffT=document.createElement('input'); ffT.type='text'; ffT.placeholder='Flag something: a payment, a risk, a date'; ffT.setAttribute('aria-label','Flag'); ffT.autocomplete='off';
    var ffD=document.createElement('input'); ffD.type='date'; ffD.setAttribute('aria-label','Due');
    var two2=node('div','two'); two2.appendChild(ffT); two2.appendChild(ffD); ff.appendChild(two2);
    var ffB=document.createElement('button'); ffB.type='submit'; ffB.className='btn ghost'; ffB.textContent='Add a flag'; ff.appendChild(ffB);
    ff.addEventListener('submit', function(ev){ ev.preventDefault(); var t=ffT.value.trim(); if(!t) return; todayWrite({op:'add', kind:'flag', item:{text:t, due:ffD.value||null, kind:'info'}}); });
    fg.appendChild(ff);

    /* money, one line each */
    if(MONEY && MONEY.months && MONEY.months.length){
      var m=MONEY.months[MONEY.months.length-1];
      var ms=section(wrap,'The money, '+m.m);
      var r1=node('div','mline'); r1.appendChild(node('span','','Revenue')); r1.appendChild(node('b','', Math.round(m.revenue).toLocaleString()+' / 100,000')); ms.appendChild(r1);
      if(m.profit!=null){ var r2=node('div','mline'); r2.appendChild(node('span','','Profit')); r2.appendChild(node('b','', Math.round(m.profit).toLocaleString()+' / 50,000')); ms.appendChild(r2); }
      ms.appendChild(node('p','msg','Source: money dashboard, built '+MONEY.built+'.'));
    }
    host.appendChild(wrap);
  }

  function frontCard(f, key){
    var card=node('div','front is-'+f.status);
    var open=!!TODAY.open[f.id];
    var line=node('div','front-line');
    line.appendChild(node('span','front-name', f.name));
    var state = f.status==='live' ? (f.due ? relDue(f.due, key) : '') : f.status==='blocked' ? 'blocked' : f.status==='waiting' ? 'waiting on them' : 'done';
    line.appendChild(node('span','front-state', state));
    line.addEventListener('click', function(){ TODAY.open[f.id]=!open; renderWeek(); });
    card.appendChild(line);
    if(f.status!=='done') card.appendChild(node('p','front-next-line', f.next || 'No next move set.'));
    if(!open) return card;
    var body=node('div','front-body');
    if(f.why) body.appendChild(node('p','front-why', f.why));
    var nx=node('div','front-next');
    nx.appendChild(node('span','k','Next'));
    if(TODAY.editing===f.id+':next'){
      var inp=document.createElement('input'); inp.type='text'; inp.value=f.next||''; inp.setAttribute('aria-label','Next move');
      var commit=function(){ var v=inp.value.trim(); if(v===(f.next||'')){ TODAY.editing=null; renderWeek(); return; } todayWrite({op:'patch', kind:'front', id:f.id, changes:{next:v}}, card); };
      inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); commit(); } if(e.key==='Escape'){ TODAY.editing=null; renderWeek(); } });
      inp.addEventListener('blur', commit); nx.appendChild(inp); setTimeout(function(){ inp.focus(); inp.select(); },0);
    } else {
      var v=node('span','v', f.next || 'Set the next move'); v.title='Tap to edit';
      v.addEventListener('click', function(){ TODAY.editing=f.id+':next'; renderWeek(); }); nx.appendChild(v);
    }
    if(f.status==='blocked' || f.blocker){
      nx.appendChild(node('span','k','Blocked by'));
      if(TODAY.editing===f.id+':blocker'){
        var inp2=document.createElement('input'); inp2.type='text'; inp2.value=f.blocker||'';
        var commit2=function(){ var v2=inp2.value.trim(); if(v2===(f.blocker||'')){ TODAY.editing=null; renderWeek(); return; } todayWrite({op:'patch', kind:'front', id:f.id, changes:{blocker:v2}}, card); };
        inp2.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); commit2(); } if(e.key==='Escape'){ TODAY.editing=null; renderWeek(); } });
        inp2.addEventListener('blur', commit2); nx.appendChild(inp2); setTimeout(function(){ inp2.focus(); },0);
      } else {
        var bv=node('span','v blocker', f.blocker || 'Say what it is waiting on'); bv.addEventListener('click', function(){ TODAY.editing=f.id+':blocker'; renderWeek(); }); nx.appendChild(bv);
      }
    }
    body.appendChild(nx);
    if(f.steps && f.steps.length){
      var ul=node('ul','steps');
      f.steps.forEach(function(s, idx){
        var li=node('li', s.done?'is-done':''); var lab=document.createElement('label'); lab.style.display='contents';
        var cb=document.createElement('input'); cb.type='checkbox'; cb.checked=!!s.done;
        cb.addEventListener('change', function(){ todayWrite({op:'step', id:f.id, idx:idx, done:cb.checked}, card); });
        lab.appendChild(cb); lab.appendChild(node('span','', s.t)); li.appendChild(lab); ul.appendChild(li);
      });
      body.appendChild(ul);
    }
    var acts=node('div','front-acts');
    var sel=document.createElement('select'); sel.setAttribute('aria-label','Status');
    [['live','Moving'],['blocked','Blocked'],['waiting','Waiting on them'],['done','Done']].forEach(function(o){ var op=document.createElement('option'); op.value=o[0]; op.textContent=o[1]; if(o[0]===f.status) op.selected=true; sel.appendChild(op); });
    sel.addEventListener('change', function(){ todayWrite({op:'patch', kind:'front', id:f.id, changes:{status:sel.value}}, card); });
    acts.appendChild(sel);
    acts.appendChild(textBtn('Add a step', function(){ var t=prompt('The step'); if(t && t.trim()) todayWrite({op:'patch', kind:'front', id:f.id, changes:{steps:(f.steps||[]).concat([{t:t.trim(), done:false}])}}, card); }));
    acts.appendChild(textBtn('Remove', function(){ if(confirm('Remove "'+f.name+'"?')) todayWrite({op:'delete', kind:'front', id:f.id}, card); }));
    body.appendChild(acts);
    card.appendChild(body);
    return card;
  }

  /* ---------- bottom navigation ---------- */
  var NAV_ICONS = {
    today:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    week:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    comms:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg>',
    board:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M3 10h18"/></svg>',
    more:'<svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></svg>'
  };
  function buildNav(){
    var nav=node('nav','bottomnav'); nav.setAttribute('aria-label','Sections');
    var w=node('div','navwrap');
    [['today','Today'],['week','Week'],['comms','Comms'],['board','Plan'],['more','More']].forEach(function(p){
      var b=document.createElement('button'); b.type='button'; b.id='nav-'+p[0]; b.innerHTML=NAV_ICONS[p[0]]; b.appendChild(node('span','',p[1]));
      b.addEventListener('click', function(){
        if(p[0]==='more'){ var tb=document.querySelector('.toolbar'); tb.hidden=false; tb.classList.add('more-open'); el('moreBtn').setAttribute('aria-expanded','true'); window.scrollTo({top:0}); return; }
        setMode(p[0]);
      });
      w.appendChild(b);
    });
    nav.appendChild(w); document.body.appendChild(nav); document.body.classList.add('has-nav');
  }
  function syncNav(m){
    ['today','week','comms','board'].forEach(function(k){ var b=el('nav-'+k); if(b) b.setAttribute('aria-current', String(m===k)); });
    var tb=document.querySelector('.toolbar'); if(tb) tb.hidden = (m==='today' || m==='week');
  }
  buildNav();

  var mode='wiz';
  function setMode(m){
    mode=m;
    el('wiz').hidden       = m!=='wiz';
    el('boardView').hidden = m!=='board';
    el('pagesView').hidden = m!=='pages';
    el('dailyView').hidden = m!=='daily';
    el('todayView').hidden = m!=='today';
    el('weekView').hidden = m!=='week';
    syncNav(m);
    el('commsView').hidden = m!=='comms';
    el('addPillar').hidden      = m!=='board';
    el('printBlankBtn').hidden  = m!=='board';
    el('printBtn').hidden       = (m==='wiz' || m==='daily' || m==='comms' || m==='today' || m==='week');
    el('printBtn').textContent  = m==='pages' ? 'Print the pages' : 'Print / PDF';
    [['tabWiz','wiz'],['tabBoard','board'],['tabPages','pages'],['tabDaily','daily'],['tabComms','comms'],['tabToday','today']].forEach(function(pair){
      el(pair[0]).setAttribute('aria-current', String(m===pair[1]));
    });
    if(m==='board'){ bindTop(); renderBoard(); }
    else if(m==='pages'){ renderPages(); }
    else if(m==='daily'){ renderDaily(); }
    else if(m==='comms'){ commsLoad(); }
    else if(m==='today'){ renderToday(); todayLoad(); }
    else if(m==='week'){ renderWeek(); if(!TODAY.data) todayLoad(); }
    else { renderWizard(); }
    window.scrollTo({top:0});
  }

  el('moreBtn').addEventListener('click', function(e){
    e.stopPropagation();
    var tb=document.querySelector('.toolbar');
    var open=tb.classList.toggle('more-open');
    el('moreBtn').setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', function(e){
    var tb=document.querySelector('.toolbar');
    if(tb.classList.contains('more-open') && !tb.contains(e.target)){
      tb.classList.remove('more-open');
      el('moreBtn').setAttribute('aria-expanded','false');
    }
  });

  el('tabWiz').addEventListener('click', function(){ setMode('wiz'); });
  el('tabBoard').addEventListener('click', function(){ setMode('board'); });
  el('tabPages').addEventListener('click', function(){ setMode('pages'); });
  el('tabDaily').addEventListener('click', function(){ viewDate=todayKey(); setMode('daily'); });
  el('tabComms').addEventListener('click', function(){ setMode('comms'); });
  el('tabToday').addEventListener('click', function(){ setMode('today'); });
  document.getElementById('tools').addEventListener('click', function(){
    document.querySelector('.toolbar').classList.remove('more-open');
    el('moreBtn').setAttribute('aria-expanded','false');
  });
  el('printBtn').addEventListener('click', function(){
    printAs(mode==='pages' ? 'a4' : 'wall');
  });
  el('printBlankBtn').addEventListener('click', function(){
    document.body.classList.add('print-prompts');
    printAs('wall');
    setTimeout(function(){ document.body.classList.remove('print-prompts'); }, 500);
  });
  function addPillar(){
    state.pillars.push({id:'p'+Date.now(), name:'', outcome:'', plan:'', notes:'', images:[]});
    save(); renderBoard();
  }
  el('addPillar').addEventListener('click', addPillar);
  el('addPillar2').addEventListener('click', addPillar);
  el('resetBtn').addEventListener('click', function(){
    if(!confirm('Wipe every answer and photo and start the interview again?')) return;
    state=blankState(); save(); setMode('wiz');
  });

  document.addEventListener('keydown', function(e){
    if(mode!=='wiz') return;
    if((e.metaKey||e.ctrlKey) && e.key==='Enter'){ e.preventDefault(); go(1); }
  });

  /* backup */
  try{ if(window.self!==window.top) el('dlBtn').hidden=true; }catch(e){ el('dlBtn').hidden=true; }
  var dlg=el('dlg');
  el('backupBtn').addEventListener('click', function(){
    el('dump').value=JSON.stringify(state);
    if(dlg.showModal) dlg.showModal(); else dlg.setAttribute('open','');
  });
  el('closeBtn').addEventListener('click', function(){ dlg.close(); });
  el('copyBtn').addEventListener('click', function(){
    var ta=el('dump'); ta.select();
    try{ navigator.clipboard.writeText(ta.value); }catch(e){ document.execCommand('copy'); }
    var b=this; b.textContent='Copied'; setTimeout(function(){ b.textContent='Copy'; },1200);
  });
  el('dlBtn').addEventListener('click', function(){
    try{
      var blob=new Blob([el('dump').value],{type:'application/json'});
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='warplan-'+(state.year||'backup')+'.json';
      document.body.appendChild(a); a.click(); a.remove();
    }catch(e){ alert('Download is blocked here. Use Copy instead.'); }
  });
  el('restoreBtn').addEventListener('click', function(){
    try{
      var inc=JSON.parse(el('dump').value);
      if(!inc || !Array.isArray(inc.pillars)) throw new Error('bad');
      state=inc;
      if(state.step==null) state.step=0;
      save(); dlg.close(); setMode(state.interviewed?'board':'wiz');
    }catch(e){ alert('That does not look like a warplan backup.'); }
  });

  /* boot */
  load().then(function(saved){
    if(!saved && SEED) saved=JSON.parse(JSON.stringify(SEED));
    if(saved && Array.isArray(saved.pillars)){
      state=saved;
      if(state.step==null) state.step=0;
      if(!state.year) state.year=String(new Date().getFullYear()+1);
      state.pillars.forEach(normImages);
    }
    setMode(state.interviewed ? 'today' : 'wiz');
  });
})();
</script>
